<!doctype html>
<html lang="vi" data-skin="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KATY AP/AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* styles.html – bộ giao diện Công nợ theo quy chuẩn HAK (token màu, thanh bên tối, thẻ, bảng tiêu đề xanh, huy hiệu, thông báo, chế độ sáng/tối).
   Giữ nguyên tên lớp mà các màn hình đang dùng (card, grid, kpi, tabs, bar, badge, msg…) để không phải sửa nghiệp vụ. */
:root{
  --bg:#f3f4f6;--surface:#ffffff;--ink:#1f2937;--ink-soft:#6b7280;--border:#e5e7eb;
  --brand:#2563eb;--brand-dark:#1f2937;--on-brand:#ffffff;--sidebar-bg:#1f2937;
  --accent:#b45309;--accent-soft:#fef3c7;--danger:#dc2626;--danger-soft:#fee2e2;--success:#16a34a;--success-soft:#dcfce7;--info-soft:#dbeafe;
  --bg-soft:#f3f4f6;--bg-soft2:#f9fafb;--bg-hover:#e5e7eb;--disabled:#9ca3af;
  --radius:10px;--shadow:0 2px 10px rgba(31,41,55,.06);color-scheme:light;
  /* tên cũ dùng trong các màn hình */
  --text:var(--ink);--muted:var(--ink-soft);--line:var(--border);--surface2:var(--bg-soft);--primary:var(--brand);--primary-ink:var(--on-brand);
  --warn:var(--accent);--ok:var(--success);--info:#1d4ed8;--danger-bg:var(--danger-soft);--warn-bg:var(--accent-soft);--ok-bg:var(--success-soft);--info-bg:var(--info-soft);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:8px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b;--surface:#18202b;--ink:#e5e7eb;--ink-soft:#9aa4b2;--border:#2f3a4a;--brand:#3b82f6;--brand-dark:#f3f4f6;--sidebar-bg:#0b1017;
  --accent:#f59e0b;--accent-soft:#3a2a0a;--danger:#f87171;--danger-soft:#3b1414;--success:#4ade80;--success-soft:#0f2e1c;--info-soft:#12263f;
  --bg-soft:#1f2937;--bg-soft2:#1b2430;--bg-hover:#273244;--disabled:#4b5563;--shadow:0 2px 10px rgba(0,0,0,.45);--info:#93c5fd;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b;--surface:#18202b;--ink:#e5e7eb;--ink-soft:#9aa4b2;--border:#2f3a4a;--brand:#3b82f6;--brand-dark:#f3f4f6;--sidebar-bg:#0b1017;
  --accent:#f59e0b;--accent-soft:#3a2a0a;--danger:#f87171;--danger-soft:#3b1414;--success:#4ade80;--success-soft:#0f2e1c;--info-soft:#12263f;
  --bg-soft:#1f2937;--bg-soft2:#1b2430;--bg-hover:#273244;--disabled:#4b5563;--shadow:0 2px 10px rgba(0,0,0,.45);--info:#93c5fd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.boot{padding:var(--s5);color:var(--muted)}
a{color:var(--brand)}
h1{font-size:20px;margin:0 0 var(--s2);font-weight:700;color:var(--brand-dark)}h2{font-size:15px;margin:var(--s4) 0 var(--s2);font-weight:600;color:var(--brand-dark)}h3{font-size:14px;margin:var(--s3) 0 var(--s2);font-weight:600;color:var(--brand-dark)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Khung: thanh bên tối + vùng nội dung ── */
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--sidebar-bg);color:#cbd5e1;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 22px;padding:0 6px}
.seal{width:40px;height:40px;border-radius:50%;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex:0 0 auto;background:rgba(180,83,9,.08)}
.seal span{font:700 12px var(--mono);color:var(--accent);letter-spacing:.5px}
.brand .name{font-weight:700;font-size:14.5px;line-height:1.25;color:#fff}.brand .sub{font-size:11px;color:#8b98ab;margin-top:2px}
.nav-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#8b98ab;padding:14px 12px 4px}
.side a.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cbd5e1;text-decoration:none;font-weight:500;font-size:13.5px;min-height:40px;transition:background .15s,color .15s;margin-bottom:2px}
.side a.nav svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.side a.nav:hover{background:#2d3a4d;color:#fff}.side a.nav.on{background:var(--brand);color:#fff}.side a.nav.on svg{opacity:1}
.side .foot{margin-top:auto;padding:14px 8px 0;font-size:11.5px;color:#8b98ab;border-top:1px solid rgba(255,255,255,.08)}
.side .foot b{display:block;color:#e5e7eb;font-weight:600;word-break:break-all}
.side .foot button{margin-top:8px;min-height:32px;padding:5px 10px;font-size:12px;background:transparent;border:1px solid #2d3a4d;color:#cbd5e1;border-radius:8px;cursor:pointer;width:100%;text-align:left}
.side .foot button:hover{background:#2d3a4d;color:#fff}
.content{min-width:0;padding:0 32px 60px}
.top{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--border);margin-bottom:var(--s4)}
.top .ctx{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;color:var(--muted);font-size:13px}
.top input{width:140px;min-height:36px}
.menu-toggle{display:none;min-height:40px;padding:6px 12px;font-weight:600}
.page-head{margin-bottom:var(--s4);display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end;justify-content:space-between}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.drawer-bg{display:none}

/* ── Thẻ, lưới, chỉ tiêu ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h2,.card h3{margin-top:0}
details.filters>summary{cursor:pointer;font-weight:600;color:var(--brand-dark);min-height:32px;display:flex;align-items:center;margin-bottom:10px}details.filters:not([open])>summary{margin-bottom:0}
.grid{display:grid;gap:var(--s3)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--brand)}.kpi .l{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:4px}
.kpi .v{font:700 19px var(--mono);color:var(--brand-dark);font-variant-numeric:tabular-nums;word-break:break-word}.kpi .s{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--border)}
.tab{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);padding:9px 16px;font:600 13px var(--font);cursor:pointer;min-height:40px;border-radius:0}
.tab:hover{color:var(--brand)}.tab.on{color:var(--brand);border-bottom-color:var(--brand);background:transparent}

/* ── Nút, biểu mẫu ── */
button,.btn{font:600 13.5px var(--font);min-height:40px;padding:8px 16px;border-radius:8px;border:0;background:var(--bg-soft);color:var(--ink);cursor:pointer;transition:filter .12s,transform .05s}
button:hover{background:var(--bg-hover)}button:active{transform:scale(.98)}
button.primary{background:var(--brand);color:var(--on-brand)}button.primary:hover{filter:brightness(1.08);background:var(--brand)}
button.danger{background:var(--danger-soft);color:var(--danger)}button.danger:hover{filter:brightness(.97)}
button:disabled{opacity:.55;cursor:not-allowed}button.sm{min-height:32px;padding:4px 10px;font-size:12px;border-radius:6px}
.bar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s3) 0}.bar .grow{flex:1}.bar.right{justify-content:flex-end}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:var(--s3);min-width:0}
input,select,textarea{font:13.5px var(--font);width:100%;min-height:40px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input[type=checkbox]{width:auto;min-height:0}
input.err,select.err,textarea.err{border-color:var(--danger);background:var(--danger-soft)}
.errmsg{color:var(--danger);font-size:12px;margin-top:3px}.hint{color:var(--muted);font-size:12.5px}
.money,td.r,th.r,input.money{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* ── Bảng: tiêu đề xanh, số căn phải, dòng tổng ── */
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
thead th{background:var(--brand);color:var(--on-brand);font-weight:600;position:sticky;top:0;white-space:nowrap;border-bottom:0;z-index:1}
td.r,th.r{text-align:right;white-space:nowrap}.neg{color:#b00020}td:first-child a{white-space:nowrap}td.c,th.c{text-align:center;white-space:nowrap}
tbody tr:hover td{background:var(--bg-soft)}tr.click{cursor:pointer}
tr.group td{background:var(--bg-soft);font-weight:700}tr.subtotal td{font-weight:700;background:var(--bg-soft2)}tr.total td,tfoot td{font-weight:700;background:var(--bg-soft);border-top:2px solid var(--border);color:var(--brand-dark)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bg-soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--success-soft);color:var(--success)}.badge.warn{background:var(--accent-soft);color:var(--accent)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.info{background:var(--info-soft);color:var(--info)}
.pager{display:flex;gap:var(--s2);align-items:center;justify-content:flex-end;margin-top:var(--s3)}
.msg{padding:10px 14px;border-radius:8px;margin:var(--s2) 0;border:1px solid transparent;font-size:13px}
.msg.ok{background:var(--success-soft);color:var(--success)}.msg.warn{background:var(--accent-soft);color:var(--accent)}.msg.danger{background:var(--danger-soft);color:var(--danger)}.msg.info{background:var(--info-soft);color:var(--info)}
.msg .retry{margin-left:10px}
.empty{padding:32px 10px;text-align:center;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}.barrow{display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;font-size:12.8px}
.barrow .track{height:12px;background:var(--bg-soft);border-radius:7px;overflow:hidden}.barrow .fill{height:100%;background:var(--brand)}

/* ── Thông báo, hộp thoại, chờ tải ── */
.toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:9999;max-width:min(420px,calc(100vw - 32px))}
.toast .msg{margin:0;color:var(--on-brand);font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18);background:var(--brand);animation:toastin .18s ease}
.toast .msg.warn{background:var(--accent)}.toast .msg.danger{background:var(--danger)}.toast .msg.ok{background:var(--brand)}.toast .msg.info{background:var(--brand)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(31,41,55,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:9990}
.modal{background:var(--surface);border-radius:var(--radius);padding:20px;width:min(760px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{margin-top:0;font-size:17px}
.modal{max-height:90vh;overflow-y:auto;padding-bottom:0}
.modal .modal-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 16px;margin-top:12px;border-top:1px solid var(--line,#e5e7eb);z-index:1}
.skeleton{height:16px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--bg-soft),var(--bg-hover),var(--bg-soft));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.loading-note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.view-fade{animation:fadein .18s ease}@keyframes fadein{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.report{background:#fff;color:#111;padding:var(--s4);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
.report h1,.report h2,.report h3,.report b{color:#111}.field input[type=checkbox]{width:auto;height:18px;margin:8px 0 0;align-self:flex-start}
.report table th{background:#e9eef6;color:#111;white-space:normal;vertical-align:bottom}.report table td{color:#111;border-color:#ccd}
/* R35: tờ báo cáo luôn là giấy trắng chữ đen kể cả khi giao diện tối (dòng nhóm, cộng, tổng, di chuột không được lấy màu nền của chủ đề tối) */
.report tr.group td{background:#eef2f8;color:#111}.report tr.subtotal td{background:#f4f6fb;color:#111}.report tr.total td,.report tfoot td{background:#e9eef6;color:#0b3a6b;border-top:2px solid #99a}.report tbody tr:hover td{background:#f3f6fb;color:#111}.report table a{color:#0b5cad}
.wm{color:#b00020;font-weight:700;letter-spacing:.04em}
.perf{font:11px var(--mono);color:#8b98ab;margin-top:6px}

/* ── Điện thoại / máy tính bảng ── */
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;max-width:86vw;z-index:9000;transform:translateX(-102%);transition:transform .2s ease;height:100%}
  body.drawer-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.drawer-open .drawer-bg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8999}
  .menu-toggle{display:inline-flex;align-items:center;gap:6px}
  .content{padding:0 12px 40px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .barrow{grid-template-columns:90px 1fr auto}
  .page-head h1{font-size:19px}.kpi .v{font-size:20px}
  .bar button{flex:1 1 auto}
  .cards table,.cards thead{display:none}
  .card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s3);margin-bottom:var(--s2)}
  .table-only{display:none}
}
@media (min-width:861px){.card-list{display:none}}
@page land{size:A4 landscape;margin:10mm}@page port{size:A4 portrait;margin:12mm}
@media print{.side,.top,.bar,.toast,.noprint,.menu-toggle{display:none!important}.layout{display:block}.content{padding:0}body{background:#fff}.report{border:0;padding:0}
.content:has(.report) .page-head{display:none!important}
.report{width:100%;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report.land{page:land}.report.port{page:port}
.report>div[style*="overflow-x"]{overflow:visible!important}
.report table{width:100%;border-collapse:collapse}.report th,.report td{padding:2px 4px;font-size:8.5pt}
.report thead{display:table-header-group}.report tr{break-inside:avoid}.report td.r,.report th.r{white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="hak-standard-tokens">
/* Chủ đề V10.3 "luxe" (mặc định). Nguồn: HAK_LUONG_OFFLINE, nhánh design/hak-enterprise-v10-4, LuongHAK_Offline/style.css, commit 715b043.
   Chủ đề hiệu lực:
     sáng = :root + [data-skin="luxe"]
     tối  = :root + [data-theme="dark"] + [data-skin="luxe"][data-theme="dark"]
   Giữ nguyên giá trị gốc; chỉ thêm --mut-aa cho chữ phụ đạt tương phản ≥ 4,5:1 trên nền sáng (xem tests/contrast.test.js). */
:root{--brand:#0e7c86;--brand2:#14a3ad;--brandH:#0b6870;--brandA:#095961;--brandSoft:rgba(14,124,134,.12);--onBrand:#fff;
--bg:#f3f6fa;--card:#fff;--ink:#14212b;--mut:#6b7a8c;--line:#e3e9f0;--line2:#edf1f4;--ctl:#d3dce2;--th:#f5f8fa;--hover:#f1f7f8;--field:#fff;
--sb:linear-gradient(180deg,#0f2740 0%,#0a1c30 100%);--sbText:#b8c7d9;--sbMut:#7d8fa3;--sbLine:rgba(255,255,255,.08);
--warnBg:#fbf4e6;--warnBd:#ecd8b0;--warnFg:#6e4710;--warn:#b45309;--red:#c2410c;--redBg:#fbe9e2;--okBg:#e2f1f2;--okFg:#0b6870;
--infoBg:#eef3fb;--infoBd:#c9d6ee;--infoFg:#24365f;--edit:#d99a2b;--editBg:#fffbf2;--focus:rgba(14,124,134,.22);
--shadow:0 1px 2px rgba(16,35,58,.05),0 6px 18px rgba(16,35,58,.06);--shadowH:0 10px 26px rgba(14,124,134,.16);--r:14px;
--hero:radial-gradient(1200px 300px at 90% -20%,rgba(255,255,255,.18),transparent 60%),linear-gradient(120deg,#0f2740,#0e7c86);
--we:#eef2f5;--c1:#e2f1f2;--c1f:#0b6870;--cH:#eef2f5;--cHf:#14212b;--cP:#e7eef8;--cPf:#23497a;--cO:#f8eed9;--cOf:#8a5a12;--cTC:#efe9fb;--cTCf:#4e3a9a;
/* tên cũ (guide.js, bản in) */
--pri:var(--brand);--pri2:var(--brandH);--priL:var(--okBg);--deep:#0f2740;--champ:#d99a2b;--champL:#f0cf8f;
color-scheme:light}
:root{--mut-aa:#6b655a}
[data-theme="dark"]{--brand:#21b5c0;--brand2:#47c8d1;--brandH:#47c8d1;--brandA:#6bd4db;--brandSoft:rgba(33,181,192,.16);--onBrand:#062c30;
--bg:#0d151e;--card:#15202c;--ink:#e3eaf2;--mut:#8ea0b5;--line:#243244;--line2:#1d2a38;--ctl:#33465a;--th:#1a2633;--hover:#1b2a38;--field:#101a25;
--sb:linear-gradient(180deg,#0a1826 0%,#071019 100%);
--warnBg:#2a2213;--warnBd:#5a4520;--warnFg:#f0cf8f;--warn:#f0b35a;--red:#ff8a6a;--redBg:#3a1e17;--okBg:rgba(33,181,192,.16);--okFg:#7fdbe2;
--infoBg:#18243a;--infoBd:#2c3d5c;--infoFg:#c3d3f0;--edit:#e0a948;--editBg:#2a2213;--focus:rgba(33,181,192,.3);
--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);--shadowH:0 10px 26px rgba(0,0,0,.45);
--hero:radial-gradient(1200px 300px at 90% -20%,rgba(255,255,255,.10),transparent 60%),linear-gradient(120deg,#0a1826,#0e5f68);
--we:#1a2633;--c1:rgba(33,181,192,.18);--c1f:#7fdbe2;--cH:#223142;--cHf:#e3eaf2;--cP:#1e2c45;--cPf:#a9c3ef;--cO:#33281a;--cOf:#f0cf8f;--cTC:#2a2340;--cTCf:#c7b8ff;
--deep:#0a1826;color-scheme:dark}
[data-theme="dark"]{--mut-aa:var(--mut)}
[data-skin="luxe"]{--brand:#1d3a63;--brand2:#2d5388;--brandH:#142b4b;--brandA:#0e203a;--brandSoft:rgba(29,58,99,.10);--onBrand:#fff;

    var end = s.lastIndexOf('</body>');
    if (end >= 0)
        s = s.slice(0, end) + '<script>window.addEventListener("message",function(e){var t=e.data&&e.data.hakTheme;if((t==="light"||t==="dark")&&window.Archify&&Archify.theme&&Archify.theme.set)Archify.theme.set(t)});<\/script>' + s.slice(end);
    return s;
}
function syncFlowTheme() {
    var f = document.querySelector('iframe[data-flow]');
    if (f && f.contentWindow)
        f.contentWindow.postMessage({ hakTheme: appMode() }, '*');
}
VIEWS.flow = async function () {
    var root = h('div'), frame = document.createElement('iframe'), msg = h('div', { class: 'hint' }, 'Đang tải sơ đồ luồng nghiệp vụ…');
    root.appendChild(h('h1', null, 'Luồng nghiệp vụ công nợ'));
    root.appendChild(msg);
    frame.setAttribute('title', 'Luồng dữ liệu nghiệp vụ công nợ');
    frame.setAttribute('sandbox', 'allow-scripts allow-downloads');
    frame.setAttribute('data-flow', '1');
    frame.style.cssText = 'width:100%;height:calc(100vh - 170px);min-height:480px;border:1px solid var(--border,#d0d5dd);border-radius:8px;background:var(--card,#fff)';
    root.appendChild(frame);
    if (!window.google || !google.script || !google.script.run)
        throw new Error('Không có google.script.run');
    await new Promise(function (res, rej) {
        google.script.run.withSuccessHandler(function (html) { frame.srcdoc = flowThemed(html); msg.textContent = 'Sơ đồ chỉ để tra cứu quy trình; không thay đổi dữ liệu.'; res(); }).withFailureHandler(rej).flowDoc();
    });
    return root;
};

    { id: 'jade', name: 'Jade', desc: 'Xanh ngọc bích, dịu mắt', sw: ['#0c2b26', '#0b6b57', '#b8903f', '#f1f6f3'] },

function skinCurrent() { return document.documentElement.getAttribute('data-skin') || 'classic'; }
function skinApply(id) {
    if (!SKINS.some(function (s) { return s.id === id; }))
        id = 'classic';
    document.documentElement.setAttribute('data-skin', id);
    try {
        localStorage.setItem('congno.skin', id);
    }
    catch (e) { }
}
function skinInit() {
    var id = 'classic';
    try {
        id = localStorage.getItem('congno.skin') || 'classic';
    }
    catch (e) { }
    if (!SKINS.some(function (s) { return s.id === id; }))
        id = 'classic';
    document.documentElement.setAttribute('data-skin', id);
}
function openSkinPicker() {
    var body = h('div'), grid = h('div', { class: 'skin-grid' });
    function paint() { Array.prototype.forEach.call(grid.children, function (c) { c.setAttribute('aria-pressed', c.getAttribute('data-id') === skinCurrent() ? 'true' : 'false'); }); }
    SKINS.forEach(function (s) {
        var sw = h('div', { class: 'skin-sw' });
        s.sw.forEach(function (c) { var i = document.createElement('i'); i.style.background = c; sw.appendChild(i); });
        var card = h('button', { type: 'button', class: 'skin-card', 'data-id': s.id, 'aria-pressed': 'false', onclick: function () { skinApply(s.id); paint(); } }, sw, h('b', null, s.name), h('span', null, s.desc));
        grid.appendChild(card);
    });
    body.appendChild(h('p', { class: 'hint' }, 'Chọn chủ đề màu cho giao diện. Mỗi chủ đề có bản sáng và tối; lựa chọn được nhớ trên trình duyệt này.'));
    body.appendChild(grid);
    body.appendChild(h('button', { type: 'button', onclick: toggleTheme }, '◐ Đổi chế độ sáng/tối'));
    paint();
    modal('Chủ đề màu', body, [{ label: 'Đóng', primary: true }]);
}
var GUIDE = [{"id": "gioi-thieu", "title": "1. Giới thiệu và đăng nhập", "blocks": [["p", "Ứng dụng **KATY AP/AR** quản lý công nợ phải thu (khách hàng) và phải trả (nhà cung cấp/shipper) theo đơn hàng, mã dịch vụ và đợt thanh toán. Mọi số tiền được lưu bằng số nguyên theo đơn vị nhỏ nhất của tiền tệ; **VND và USD là hai sổ riêng, không cộng lẫn**."], ["ol", ["Mở đường dẫn ứng dụng bằng trình duyệt và đăng nhập đúng tài khoản Google đã được quản trị viên cấp quyền.", "Nếu thấy thông báo **\"Tài khoản chưa được cấp quyền sử dụng hệ thống\"**, hãy gửi email Google của bạn cho quản trị viên. Nếu thấy **\"Tài khoản đã bị tạm khóa\"**, liên hệ quản trị viên để mở lại.", "Nếu thấy **\"Không xác minh được tài khoản Google\"**, đăng xuất các tài khoản Google khác, đăng nhập lại và cấp quyền cho ứng dụng."]], ["tip", "Ô **Ngày chốt** ở đầu trang quyết định số dư, tuổi nợ và dashboard được tính tại ngày nào. Đổi ngày chốt thì màn hình hiện tại tự tải lại."]]}, {"id": "vai-tro", "title": "2. Vai trò và quyền", "blocks": [["p", "Menu chỉ hiển thị những màn hình bạn có quyền dùng. Quyền luôn được kiểm tra lại ở máy chủ, nên ẩn nút không phải là cơ chế bảo mật duy nhất."], ["table", ["Vai trò", "Được làm", "Không được làm"], [["Kế toán nhập liệu", "Tạo/sửa đối tác, đơn hàng, chi phí, chứng từ, phiếu thu/chi; gửi duyệt; phân bổ; nhập hàng loạt, sao kê, dư đầu kỳ; xem và xuất báo cáo", "Duyệt, ghi nhận, đảo, điều chỉnh, khóa kỳ"], ["Kế toán trưởng/Người duyệt", "Toàn bộ quyền của kế toán, cộng duyệt/từ chối, ghi nhận, đảo, điều chỉnh, vượt hạn mức tín dụng, khóa kỳ, yêu cầu mở lại kỳ, phát hành bản chốt báo cáo, sao lưu và khôi phục, xem nhật ký", "Tự duyệt chứng từ do chính mình lập hoặc gửi duyệt"], ["Lãnh đạo", "Xem Tổng quan, Báo cáo và xuất báo cáo", "Nhập liệu, duyệt"], ["Kiểm soát viên", "Xem dữ liệu, báo cáo, nhật ký, danh sách sao lưu", "Mọi thao tác ghi"], ["Quản trị hệ thống", "Người dùng và phạm vi, Danh mục/Cấu hình, Nhật ký, Sao lưu, xác nhận mở lại kỳ", "Nhập liệu nghiệp vụ (vai trò này không có quyền đọc dữ liệu công nợ)"]]], ["p", "Mỗi người dùng còn có **phạm vi dữ liệu**: toàn bộ đối tác, hoặc chỉ một số nhóm kinh doanh, đối tác hoặc nhãn đối tác. Dữ liệu ngoài phạm vi sẽ báo **\"Ngoài phạm vi dữ liệu được cấp\"**."]]}, {"id": "giao-dien", "title": "3. Làm quen giao diện và chủ đề màu", "blocks": [["ul", ["**Bàn làm việc** là trang đầu tiên sau khi vào hệ thống: phần **Việc cần làm** tóm tắt việc đang chờ (dòng nợ thiếu hạn, chứng từ nghi trùng, chứng từ chờ xử lý...), bên dưới là các khối chức năng xếp theo chu trình (doanh thu, cung ứng, tiền và thanh toán, ghi sổ - kỳ - báo cáo, danh mục và hệ thống). Bấm một khối để mở đúng màn hình; chỉ hiện các chức năng bạn có quyền.", "**Menu trái** chia theo nhóm: Tổng quan · Đơn hàng và chi phí · Công nợ và thu chi · Ghi sổ và đối chiếu · Báo cáo và kỳ · Hệ thống.", "**Luồng nghiệp vụ** (dưới Tổng quan) hiển thị sơ đồ dòng dữ liệu từ đối tác đến báo cáo. Đây là màn hình chỉ để tra cứu.", "Cuối menu có nút **Giao diện sáng/tối** và nút **Chủ đề màu**. Chọn một trong 5 chủ đề theo chuẩn HAK Enterprise Design System: **Classic** (xanh ngọc teal trên nền navy, mặc định), **Luxe** (xanh navy và vàng champagne trên nền ngà), **Jade** (xanh ngọc bích), **Neutral** (xám xanh doanh nghiệp), **Champagne** (vàng ấm). Mỗi chủ đề có bản sáng và tối. Lựa chọn chỉ lưu trên trình duyệt này, không ghi vào dữ liệu nghiệp vụ.", "Trên điện thoại, dùng nút menu để mở/đóng thanh bên.", "**Bộ lọc thông minh (HAK Smart Filter)** ở các màn Công nợ phải thu/phải trả, Đơn hàng/PO, Phiếu thu/chi (và COST): một thanh gồm ô tìm không dấu, khoảng ngày (Từ/Đến) hoặc chọn **Kỳ** (tháng), nút **Lọc**, **Lọc nâng cao**, **Xóa lọc** và danh sách **bộ lọc đã lưu**. Hộp **Lọc nâng cao** chia nhóm: đối tượng (đối tác, nhóm nghiệp vụ, tiền tệ, quỹ, mã dịch vụ), trạng thái, số tiền từ–đến (chỉ khi chọn đúng một tiền tệ), hạn thanh toán từ–đến, và điều kiện nhanh (quá hạn, thiếu ngày đến hạn, có cảnh báo, chỉ khoản còn nợ, chỉ dư đầu kỳ, chỉ phiếu chưa phân bổ…). Điều kiện đang áp dụng hiện thành **chip** (bấm để bỏ từng cái); dòng \"Kết quả: N dòng · Phạm vi lọc: …\" mô tả đúng điều kiện đang dùng. Lọc và tổng do **máy chủ** tính, luôn nằm trong phạm vi dữ liệu của tài khoản bạn (lọc không mở rộng quyền xem); điều kiện không hợp lệ bị báo lỗi chứ không bị bỏ qua. Điều kiện nằm trên địa chỉ trang nên chép đường dẫn là gửi được cho người khác; các liên kết cũ từ Tổng quan vẫn chạy. **Lưu bộ lọc** lưu điều kiện (không lưu dữ liệu) trên trình duyệt của bạn, riêng từng màn hình; khi mở lại bộ lọc cũ mà có điều kiện màn hình không còn hỗ trợ, ứng dụng báo rõ điều kiện nào bị bỏ.", "**Dòng con (cha–con):** ở danh sách chứng từ, đơn hàng và phiếu thu/chi, bấm nút ▸ đầu dòng (hoặc Enter/Space) để mở dòng con: dòng phí và phân bổ thanh toán của chứng từ, khoản phát sinh của đơn (kể cả phần chia từ chi phí chung), phân bổ của phiếu. Dòng con chỉ tải khi mở và được nhớ trong lần xem; có \"Mở tất cả / Thu gọn tất cả\"; lỗi mạng hiện nút Thử lại. Nhãn **Khớp/Lệch** do máy chủ đối chiếu tổng dòng con với tổng chứng từ (và phân bổ với sổ), chỉ gồm phần trong phạm vi của bạn. Dòng con chỉ để xem; sửa ở màn chi tiết.", "**Tổng hợp công nợ (số liệu dựng sẵn):** menu *Tổng hợp công nợ* có 3 tab — Khách hàng/NCC (dư nợ, quá hạn, đến hạn 7 ngày, chưa xác định hạn, tiền chưa phân bổ), PO chưa thanh toán (doanh thu, chưa lập/đang lập hóa đơn, phải thu còn lại, chi phí) và Chi phí chưa thanh toán. Hệ thống **tự dựng sẵn các bảng tổng hợp mỗi 5 phút khi có thay đổi dữ liệu** nên các màn này (và Bàn làm việc, Tổng quan khi bạn có phạm vi toàn bộ) mở rất nhanh. Đầu màn ghi thời điểm dựng; nếu có thay đổi mới hơn sẽ hiện \"Có N thay đổi mới chưa vào bảng tổng hợp\"; bấm **Tính lại ngay** để tính trực tiếp (chậm hơn) và cập nhật cho mọi người. Danh sách được lọc theo phạm vi dữ liệu của tài khoản bạn; tổng do máy chủ tính. Muốn số tức thời tuyệt đối (ví dụ khi đối chiếu), dùng các màn Công nợ/Đơn hàng/Phiếu thu-chi hoặc nút Tính lại ngay."]]]}, {"id": "luong-tong-the", "title": "4. Luồng nghiệp vụ tổng thể", "blocks": [["ol", ["**Đối tác** (khách/NCC) được tạo trước.", "**Đơn hàng/PO** gắn khách, số PO và mã dịch vụ.", "Từ đơn hàng ghi nhận **doanh thu** và **chi phí** (khoản phát sinh).", "Từ khoản phát sinh **lập hóa đơn** thành chứng từ phải thu/phải trả ở trạng thái Nháp.", "Chứng từ đi qua **gửi duyệt → duyệt → ghi nhận**.", "**Phiếu thu/chi** cũng đi qua duyệt và ghi nhận, rồi **phân bổ** vào các dòng phí.", "Hệ thống tính **số dư, tuổi nợ**, hỗ trợ **nhắc nợ** và **báo cáo R01–R09**."]], ["warn", "Các nguyên tắc cốt lõi: công nợ chỉ phát sinh khi chứng từ được **ghi nhận**; hóa đơn nháp không tạo công nợ; người lập không tự duyệt chứng từ của mình; số dư không lưu sẵn mà tính bằng thành tiền trừ tổng phân bổ tại ngày chốt."]]}, {"id": "doi-tac", "title": "5. Đối tác", "blocks": [["ul", ["Mở **Đối tác** để xem, tìm, thêm hoặc sửa. Có thể đánh dấu là khách hàng, nhà cung cấp hoặc cả hai.", "Khai báo **số ngày thanh toán** (điều khoản) để hệ thống gợi ý ngày đến hạn, và **hạn mức tín dụng** nếu cần kiểm soát công nợ phải thu.", "Nhập đối tác hàng loạt: dán từ Excel mỗi dòng một đối tác theo mẫu **Tên viết tắt | Tên pháp lý | MST | Khách hàng (1/0) | Nhà cung cấp (1/0) | Số ngày hạn nợ | Email | Địa chỉ | Điện thoại | Người liên hệ | Chức vụ | Số tài khoản | Ngân hàng** (các cột sau Email có thể bỏ trống), hoặc tải tệp CSV/văn bản; xem trước rồi mới ghi. Nhập hàng loạt chỉ dành cho người có phạm vi toàn bộ đối tác.", "Hồ sơ đối tác có thêm thông tin liên hệ và thanh toán: **địa chỉ, điện thoại, người liên hệ, chức vụ, email, số tài khoản, ngân hàng (tên, chi nhánh)**. Điện thoại 6–20 ký tự (số, +, khoảng trắng, dấu - . ( )); số tài khoản 4–34 ký tự (chữ, số, gạch). Ô **Thông tin ngân hàng khác** vẫn dùng làm ghi chú. Tên người liên hệ và điện thoại tìm kiếm được ở ô tìm đối tác; tất cả hiện ở trang chi tiết đối tác.", "Nhãn phạm vi (scope tag) dùng để giới hạn người dùng chỉ thấy một nhóm đối tác. Người bị giới hạn phạm vi chỉ sửa được đối tác trong phạm vi của mình, và khi lưu phải gán nhãn thuộc phạm vi đó (nếu không đối tác sẽ biến mất khỏi tầm nhìn của họ)."]]]}, {"id": "don-hang", "title": "6. Đơn hàng/PO, doanh thu và chi phí", "blocks": [["ul", ["**Đơn hàng/PO (Revenue)**: tạo đơn gắn khách, số PO, ngày, nhóm kinh doanh, tiền tệ và **mã dịch vụ** (bắt buộc, chọn một hoặc nhiều mã từ Danh mục → Mã dịch vụ). Mỗi mã dịch vụ trong PO được **cấp tự động một số HSDV riêng** khi lưu theo công thức `GML/<mã dịch vụ>/<tên viết tắt khách>-<2 số cuối năm>/<STT 3 số>`, ví dụ `GML/FWD/YUANDA-26/001`. Tên viết tắt lấy từ hồ sơ đối tác (bỏ dấu, viết hoa, bỏ khoảng trắng); STT đếm riêng theo khách + mã dịch vụ + năm và bắt đầu lại từ 001 khi sang năm mới. Số đã cấp không đổi và không đổi khách hay năm của đơn (hủy và tạo đơn mới nếu cần). Thêm mã mới vào PO thì cấp thêm số; bỏ một mã chỉ được khi chưa có khoản doanh thu/chi phí nào mang mã đó. Đơn cũ chưa có mã dịch vụ chưa nhận được doanh thu/chi phí mới: Bàn làm việc và Tổng quan có cảnh báo \"N PO đang mở chưa có mã dịch vụ\"; bấm vào để lọc, tick các PO rồi **Gán mã dịch vụ** một lần (mỗi PO được cấp số HSDV riêng), hoặc mở từng PO để chọn nhiều mã. Khi thêm doanh thu/chi phí vào PO có nhiều mã dịch vụ, mỗi khoản (doanh thu và cả chi phí) phải chọn một mã của PO (PO chỉ một mã thì tự điền): chi phí của PO nào mang mã dịch vụ của PO đó và hiện kèm số HSDV, bộ phận thực hiện ở màn Chi phí; hóa đơn lập từ khoản mang mã đó. Đơn có trạng thái mở, đóng hoặc hủy; đơn đã đóng có thể mở lại.", "**COST** (chi phí nhà cung cấp): ghi các khoản chi phải trả nhà cung cấp, có thể gắn một đơn hoặc **chia theo nhiều đơn**.", "Mỗi khoản có loại phí, số lượng container, thành tiền chưa thuế, **chế độ thuế** (Không chịu thuế / Có thuế suất / Chưa xác nhận) và thuế VAT tính sẵn.", "Khoản chưa lập hóa đơn có thể **hủy**. Khoản đã lập hóa đơn thì chỉ giải phóng khi chứng từ bị xóa hoặc đảo.", "**Vòng đời khoản phát sinh:** Chưa lập hóa đơn (OPEN) → **Đang lập hóa đơn** (INVOICING, đã có hóa đơn nháp/chờ duyệt) → Đã lập hóa đơn (INVOICED); hủy hoặc đảo hóa đơn thì khoản trở về Chưa lập. Khoản Đang lập hóa đơn **không biến mất và không tính hai lần**: dashboard, R09, chi tiết đơn và điều kiện đóng đơn đều tính riêng nhóm này; đơn còn khoản Đang lập hóa đơn thì chưa đóng được.", "**Thu hộ/chi hộ** (khoản đánh dấu hộ) được tách khỏi doanh thu/chi phí dịch vụ và khỏi lãi gộp: chi tiết đơn và R09 hiện riêng Doanh thu dịch vụ, Chi phí dịch vụ, Thu hộ, Chi hộ và **Số hộ chưa đối ứng** (thu hộ ≠ chi hộ). Hệ thống không tự biến chênh lệch hộ thành lợi nhuận và không tự tạo khoản đối ứng; khoản chi hộ chưa đủ căn cứ ở trạng thái **chờ xác minh**. Nghĩa vụ phải thu/phải trả và dòng tiền của khoản hộ vẫn được giữ. Lãi gộp tính **riêng từng tiền tệ**.", "Hủy khoản phát sinh hoặc đơn lưu **ngày hủy**; báo cáo tại ngày trước ngày hủy vẫn gồm khoản đó. Lưu, hủy khoản/đơn, đổi ngày đơn hoặc nhập hàng loạt vào kỳ đã **khóa** đều bị chặn.", "Màn **COST** có bộ lọc **Chỉ chi phí chờ phân bổ**: chi phí chung (không thuộc đơn, không chia) và chi phí của đơn chưa có mã dịch vụ/HSDV. Đây là danh sách chờ phân bổ; chi phí chia nhiều đơn hoặc đã gắn mã không nằm trong danh sách."]], ["ul", ["**Lọc theo nhiều đơn hàng:** ở danh sách *Đơn hàng*, mục lọc **Đơn hàng / PO (chọn nhiều)** là danh sách thả xuống tích chọn được nhiều đơn cùng lúc (hiện số đơn, PO, khách), kết hợp được với các bộ lọc khác. Danh sách *Chứng từ phải thu/phải trả* cũng có mục lọc Đơn hàng / PO chọn nhiều."]]]}, {"id": "nhap-hang-loat", "title": "7. Nhập PO/doanh thu/Cost hàng loạt", "blocks": [["ol", ["Mở **Nhập PO/Cost hàng loạt** và chọn loại cần nhập (PO/doanh thu hoặc Cost).", "Dán dữ liệu từ Excel (mỗi dòng một bản ghi, theo dòng ví dụ hiển thị trên màn hình) hoặc tải tệp CSV/văn bản.", "Bấm xem trước. Hệ thống báo dòng hợp lệ, cảnh báo và lỗi từng dòng.", "Sửa tệp nếu có lỗi, rồi xác nhận ghi."]], ["ul", ["**Nhập chi phí**: cột đầu dùng để tìm đơn theo số đơn, nếu không có thì theo số PO khách (duy nhất).", "**Nhập doanh thu**: các dòng được gom theo khách + số PO; mỗi dòng ghi một mã dịch vụ (bắt buộc, đúng mã trong Danh mục). PO có thêm mã nào xuất hiện thì được cấp thêm mã và số HSDV đó. Với chi phí gắn một đơn có nhiều mã dịch vụ, điền cột Mã dịch vụ ở cuối dòng.", "Thêm tay từng khoản thì gắn thẳng vào đơn đã chọn, mang mã dịch vụ của đơn."]]]}, {"id": "chung-tu", "title": "8. Chứng từ phải thu và phải trả", "blocks": [["p", "Mở **Phải thu** hoặc **Phải trả**. Mỗi chứng từ gồm phần đầu (đối tác, tiền tệ, ngày, hóa đơn, hạn thanh toán) và các dòng phí."], ["table", ["Trạng thái", "Ý nghĩa", "Bước tiếp theo"], [["Nháp", "Đang soạn, chưa tạo công nợ", "Sửa, xóa, gửi duyệt"], ["Chờ duyệt", "Đã gửi duyệt, đã có số chứng từ", "Người duyệt khác: duyệt hoặc từ chối (bắt buộc ghi lý do)"], ["Đã duyệt", "Chờ ghi nhận", "Ghi nhận vào sổ"], ["Bị từ chối", "Trả về kèm lý do", "Sửa rồi gửi duyệt lại, hoặc xóa"], ["Đã ghi nhận", "Đã tạo công nợ chính thức", "Phân bổ thanh toán; muốn sửa phải đảo hoặc điều chỉnh"], ["Đã đảo / Đã xóa", "Đã vô hiệu", "Chỉ xem"]]], ["ul", ["**Số chứng từ** cấp khi gửi duyệt: PT (phải thu), PTR (phải trả), DH (đảo), DC (điều chỉnh), kèm năm và số thứ tự 6 chữ số.", "**Người lập và người gửi duyệt không được tự duyệt.** Cần một người duyệt khác.", "Chỉ người lập hoặc người duyệt được xóa chứng từ nháp/bị từ chối.", "Hệ thống cảnh báo **nghi trùng** khi cùng đối tác và tiền tệ mà trùng số hóa đơn (và ký hiệu), hoặc trùng ngày + số tiền + chiều công nợ. Khi ghi nhận, muốn tiếp tục phải xác nhận và nhập lý do.", "Với phải thu, hệ thống kiểm **hạn mức tín dụng/quá hạn** khi ghi nhận. Chính sách mặc định chỉ **cảnh báo**; nếu quản trị cấu hình chặn thì người duyệt phải chọn vượt hạn mức kèm lý do mới ghi nhận được.", "**Đảo chứng từ** chỉ làm được khi không còn phân bổ thanh toán (đảo phân bổ trước), chứng từ chưa có điều chỉnh (kể cả bản nháp; xóa hoặc điều chỉnh ngược trước), ngày đảo không trước ngày chứng từ gốc. Không đảo chứng từ đảo/điều chỉnh, hãy lập điều chỉnh ngược lại.", "**Điều chỉnh giảm** không được vượt số dư còn lại của dòng gốc, tính cả các bản điều chỉnh giảm đang chờ và khi ghi nhận kiểm tra lại. Điều chỉnh không tách VAT (hệ thống nhắc khi dòng gốc có thuế). Ngày ghi nhận không được trước ngày chứng từ.", "**Điều chỉnh tăng/giảm** dùng để sửa sai cho chứng từ đã ghi nhận, kể cả trong kỳ đã khóa (ghi nhận vào kỳ đang mở).", "**Ngày ghi nhận:** khi bấm Ghi nhận hệ thống hỏi **ngày ghi nhận** (mặc định là ngày chứng từ nếu còn trong tháng hiện tại, ngược lại là hôm nay; không được là ngày tương lai, không được rơi vào kỳ đã khóa). Sổ công nợ và báo cáo mặc định tính theo **ngày ghi nhận**. Ví dụ chứng từ ngày 30/09 ghi nhận ngày 23/10 xuất hiện trong sổ từ 23/10, **không làm đổi số liệu đã chốt tại 30/09**. Thanh toán, phân bổ, điều chỉnh và đảo cũng theo ngày hiệu lực của chính nó."]], ["warn", "Khoản **chi hộ** không tính VAT: dòng chi hộ phải chọn \"không chịu thuế\" (VAT của khoản gốc thuộc hóa đơn đứng tên khách hàng). Sửa bản nháp chứng từ, phiếu hay đơn hàng chỉ làm được với đối tác trong phạm vi dữ liệu của chị/anh; phân bổ thanh toán cũng kiểm tra phạm vi của từng chứng từ đích."], ["ul", ["**Số lượng, đơn giá, thành tiền (thay cho \"SL container\"):** mỗi dòng phí có **Số lượng (SL)** (tối đa 3 số lẻ), **Đơn giá** (tối đa 4 số lẻ) và **Thành tiền trước thuế**. Có SL **và** đơn giá thì thành tiền **tự tính = SL × đơn giá** (làm tròn theo tiền tệ) và ô thành tiền bị khóa. Có SL mà **không có đơn giá** thì gõ thành tiền; ô đơn giá hiện gợi ý *Đơn giá ≈ thành tiền ÷ SL* (chỉ để tham khảo, không lưu). Có đơn giá mà thiếu SL thì máy chủ từ chối.", "Áp dụng cho hóa đơn bán/mua nhập tay, khoản phát sinh (doanh thu, chi phí) và **các mẫu nhập hàng loạt** (hóa đơn bán, hóa đơn mua, PO/doanh thu, chi phí): mẫu có cột *SL (số lượng)* và *Đơn giá*. Để trống *Số tiền trước thuế* khi đã có SL + đơn giá thì hệ thống tự tính; nhập cả hai thì phải khớp; có đơn giá mà thiếu SL thì báo lỗi dòng đó.", "**Nhập số có dấu phân cách:** khi gõ số tiền, SL, đơn giá, hệ thống tự thêm dấu chấm phân cách hàng nghìn (ví dụ gõ 1234567 thành 1.234.567); dấu thập phân là **dấu phẩy**. Tiền VND chỉ nhập số nguyên."]]]}, {"id": "chi-phi-khong-hoa-don", "title": "Chi phí không có hóa đơn GTGT", "blocks": [["p", "**Công nợ phải trả chỉ phát sinh từ chứng từ phải trả đã được ghi nhận.** Khoản phát sinh (COST) gắn đơn mà chưa lập hóa đơn **chưa phải công nợ**: nó chỉ tính vào chi phí/lãi gộp của đơn và hiện ở mục *Phát sinh chưa lập hóa đơn*. Chi phí không có hóa đơn GTGT cũng đi theo đường này, chỉ khác ở **thuế** và **số chứng từ**."], ["ol", ["**Thuế:** ở dòng chi phí chọn **Không chịu thuế (KCT)**. VAT bằng 0, số phải trả = đúng số tiền, dòng không vào bảng kê thuế mua vào. Đừng để **Chưa xác nhận**: hệ thống cảnh báo và giữ dòng ngoài báo cáo thuế cho tới khi xác nhận.", "**Gắn đơn/PO:** nhập khoản COST ở màn chi tiết đơn hoặc Nhập hàng loạt → Cost (cột *Số đơn / PO khách*), chọn đúng mã dịch vụ nếu PO có nhiều mã. Khoản được tính vào chi phí của đơn ngay cả khi chưa có hóa đơn.", "**Tạo chứng từ phải trả:** (a) nhập tay hóa đơn mua (*Phải trả → Thêm*), gắn đơn/PO ở từng dòng phí — số hóa đơn **không bắt buộc**; hoặc (b) tick khoản phát sinh rồi **Ghi nhận hóa đơn mua** — cách này **bắt buộc số hóa đơn và ngày hóa đơn** của nhà cung cấp; hoặc (c) Nhập hàng loạt → Hóa đơn mua — cột *Số hóa đơn* bắt buộc. Với (b) và (c), điền **số biên nhận / bảng kê / số chứng từ nội bộ** vào ô số hóa đơn và ghi \"KHÔNG HÓA ĐƠN\" ở ghi chú hoặc diễn giải.", "**Duyệt và ghi nhận:** chứng từ đi qua Nháp → Chờ duyệt → Đã duyệt → Đã ghi nhận như mọi chứng từ (người lập không tự duyệt). Công nợ phải trả chỉ tính từ **ngày ghi nhận**.", "**Trả tiền:** dùng phiếu chi hoặc **Nhập sao kê / sổ thu chi**; điền số chứng từ ở cột *Số HĐ/Mã dịch vụ* để hệ thống gợi ý phân bổ vào đúng khoản phải trả."]], ["table", ["Tình huống", "Cách ghi", "Thuế", "Công nợ"], [["Chưa có hóa đơn nhưng sẽ có", "Khoản phát sinh COST (OPEN) gắn đơn; khi có hóa đơn: *Ghi nhận hóa đơn mua* từ khoản", "Theo hóa đơn khi có", "Phát sinh khi chứng từ được ghi nhận"], ["Không bao giờ có hóa đơn, có đơn/PO", "Khoản COST KCT + chứng từ phải trả với số biên nhận/bảng kê thay số hóa đơn", "KCT, không vào bảng kê mua vào", "Phải trả nhà cung cấp, trả bằng phiếu chi"], ["Chi lặt vặt, phí ngân hàng, không đơn", "Nhập sao kê / sổ tiền mặt, Đối tác = nhà cung cấp riêng (ví dụ \"CHI PHÍ KHÔNG HÓA ĐƠN\"), Diễn giải ghi \"KHÔNG HÓA ĐƠN\"", "Không có", "Không tạo phải trả; khoản đã chi hiện là \"đã trả chưa phân bổ\" của nhà cung cấp riêng đó"]]], ["warn", "Điều kiện chứng từ hợp lệ để chi phí được trừ khi tính thuế, và hạch toán tài khoản chi phí, do **kế toán trưởng** quyết định theo quy định hiện hành. Ứng dụng chỉ ghi nhận công nợ và sổ quỹ, **không đánh giá** khoản nào được trừ thuế. Chưa có loại chứng từ riêng \"chi phí không hóa đơn\" (số tự sinh, người nhận tiền, đính kèm biên nhận): hiện dùng số biên nhận/bảng kê nhập vào ô số hóa đơn nên cần ghi chú rõ để không nhầm với hóa đơn thật."]]}, {"id": "thu-chi", "title": "9. Phiếu thu/chi và phân bổ", "blocks": [["ul", ["Mở **Thu/Chi** để lập phiếu thu (từ khách) hoặc phiếu chi (cho NCC). Mục đích: Thanh toán, Ứng trước hoặc Hoàn tiền.", "Phiếu đi qua các trạng thái giống chứng từ: Nháp → Chờ duyệt → Đã duyệt → Đã ghi nhận. Số phiếu: PH (thu), PC (chi).", "Phiếu đã ghi nhận được **phân bổ** vào các dòng phí còn nợ. Hệ thống gợi ý phân bổ theo thứ tự cũ nhất trước (FIFO) hoặc theo số hóa đơn/ghi chú khớp.", "Phần chưa phân bổ của phiếu là số dư ứng trước, dùng phân bổ sau.", "**Đảo phân bổ** trước, rồi mới đảo được phiếu. Ngày đảo không được trước ngày hiệu lực của phiếu."]], ["tip", "Ngày hiệu lực của phiếu quyết định kỳ kế toán ghi nhận. Nếu kỳ đã khóa, hệ thống từ chối."], ["warn", "Chỉ người lập (hoặc người duyệt) được gửi duyệt phiếu; người lập không được tự từ chối hay tự duyệt phiếu của mình."], ["ul", ["**Phân bổ theo chứng từ công nợ:** ở bảng *Phân bổ phần chưa phân bổ* (mở từ phiếu hoặc menu **Phân bổ thu/chi**), mỗi dòng là một **chứng từ** còn nợ (số CT, số HĐ, ngày, hạn, còn nợ). **Tích chọn** chứng từ cần phân bổ: ô *Phân bổ* tự điền số còn nợ (tối đa số tiền còn lại của phiếu); có thể sửa số nhỏ hơn để phân bổ một phần. Bỏ tích thì xóa số đã điền.", "Hệ thống **chỉ tự phân bổ khi bấm nút \"Tự động theo thứ tự thời gian (FIFO)\"**: lần lượt từ chứng từ cũ nhất đến mới nhất cho tới hết số tiền của phiếu. Sau đó vẫn sửa/bỏ chọn được trước khi bấm **Ghi phân bổ**. Chứng từ có nhiều dòng phí thì số phân bổ được chia theo thứ tự dòng.", "Tổng phân bổ không được vượt số tiền chưa phân bổ của phiếu; số phân bổ cho một chứng từ không vượt số còn nợ của chứng từ đó."]], ["ul", ["**Chọn hóa đơn thanh toán ngay trên phiếu thu/chi:** khi lập phiếu, chọn Đối tác và Tiền tệ thì phía dưới hiện khối **\"Chọn hóa đơn thanh toán\"** liệt kê các chứng từ còn nợ (đúng chiều: phiếu thu → hóa đơn bán, phiếu chi → hóa đơn mua), xếp theo ngày. Nhập số tiền phiếu rồi **tích chọn** chứng từ (tự điền số còn nợ, tối đa số tiền của phiếu, sửa được để trả một phần) hoặc bấm **Tự động theo thứ tự thời gian (FIFO)**. Không chọn gì thì phiếu để \"chưa phân bổ\" như trước.", "Lựa chọn được **lưu cùng phiếu** (xem ở chi tiết phiếu mục *Hóa đơn đã chọn để thanh toán*). Khi người có quyền bấm **Ghi nhận**, hệ thống **tự phân bổ** vào đúng các chứng từ đã chọn. Nếu lúc đó chứng từ đã hết nợ hoặc không phân bổ được (ví dụ ngày chứng từ sau ngày phiếu), phiếu **vẫn được ghi nhận**, thông báo nêu lý do và chị phân bổ tay ở mục *Phân bổ thu/chi*."]]]}, {"id": "quy-tien-mat", "title": "Quỹ tiền mặt: không chi vượt số dư", "blocks": [["p", "Mỗi **tài khoản quỹ** (Thiết lập → Danh mục → Tài khoản quỹ) có **loại**: *Tiền mặt (CASH)* hoặc *Ngân hàng (BANK)*. Quỹ **tiền mặt** (VND và ngoại tệ) **không được chi vượt số dư**; quỹ ngân hàng giữ cách cũ (quỹ ngoại tệ thiếu số dư thì tạm ghi theo tỷ giá ngày kèm cảnh báo). Quỹ chưa khai loại cũng không bị chặn."], ["ul", ["**Áp dụng khi ghi nhận:** phiếu chi, phiếu chuyển quỹ (quỹ đi), bán ngoại tệ (quỹ ngoại tệ), mua ngoại tệ (quỹ VND trả tiền), và **lô Nhập sao kê / sổ thu chi** (cộng dồn cả lô theo ngày).", "Hệ thống chặn khi thao tác làm quỹ **âm hoặc vượt số dư tại ngày hiệu lực hoặc bất kỳ ngày sau đó** (ví dụ chi lùi ngày làm các lần chi sau thiếu quỹ). Số âm có sẵn từ dữ liệu cũ không bị đổ cho phiếu mới.", "**Đảo** phiếu thu vào quỹ, phiếu chuyển quỹ (quỹ nhận), phiếu bán/mua ngoại tệ (phần tiền vào quỹ) hoặc xử lý **thừa kiểm kê** mà tiền đã chi hết cũng bị chặn.", "Báo lỗi **CASH_OVERDRAFT** và không đổi dữ liệu. Cách xử lý: kiểm tra số dư/ngày hiệu lực, ghi nhận trước phiếu thu hoặc phiếu chuyển tiền vào quỹ, hoặc đổi quỹ chi."]], ["tip", "Quỹ nào là tiền mặt hay ngân hàng do **loại** của tài khoản quỹ quyết định. Muốn quỹ bị kiểm số dư, chọn loại *Tiền mặt*."]]}, {"id": "thu-ho-chi-ho", "title": "Thu hộ / Chi hộ", "blocks": [["p", "**Chi hộ**: mình chi trả hộ khách rồi **thu lại của khách** (khoản phải thu). **Thu hộ**: mình thu tiền hộ rồi phải **trả lại** (khoản phải trả). Cả hai chỉ là khoản **hộ**: không phải doanh thu/chi phí, không vào lãi gộp và không tính VAT."], ["ol", ["Khi thêm khoản, tick ô hộ: ở **doanh thu / phải thu** ô ghi **Chi hộ (thu lại của khách)**, ở **chi phí / phải trả** ô ghi **Thu hộ (trả lại khách)**. Trên hóa đơn: phải thu ghi Chi hộ, phải trả ghi Thu hộ.", "Vào menu **Tiền và thanh toán → Thu hộ / Chi hộ**: xem từng khoản, số đã ghép và số còn mở, tuổi khoản còn mở (0–30, 31–60, 61–90, trên 90 ngày).", "Bấm **Ghép** ở một khoản để bù trừ với khoản ngược chiều (cùng tiền tệ, ưu tiên cùng đơn rồi cùng khách) và nhập số tiền ghép; có thể ghép một phần. Ghép khác đơn/khách phải xác nhận lại.", "Bấm **Xem ghép** để xem hoặc **Gỡ** bản ghép. Khoản đang được ghép thì không hủy được: gỡ ghép trước.", "Hai tab **Đối chiếu theo khách hàng / đơn hàng** cho biết nhóm nào còn chi hộ chưa thu lại hoặc thu hộ chưa trả lại."]], ["ul", ["Khoản hộ **không chịu thuế**: chỉ chọn *Không chịu thuế*; thuế suất hoặc \"chưa xác nhận\" bị từ chối. Ghép theo tiền gốc.", "Hủy đơn đang có khoản được ghép bị chặn: gỡ ghép trước.", "Hai khoản hộ **ngoại tệ** khác ngày: khi ghép, hệ thống lưu tỷ giá hai ngày và **chênh lệch tỷ giá** (dương = lãi, âm = lỗ), đưa vào bút toán chênh lệch tỷ giá *đã thực hiện* của tháng (chiều \"Bù trừ thu hộ/chi hộ\"). Thiếu tỷ giá một trong hai ngày thì chênh lệch ghi 0 và có cảnh báo; nhập tỷ giá rồi gỡ ghép, ghép lại. Gỡ ghép thì phần này được điều chỉnh ngược ở lần xem trước kế tiếp."]]]}, {"id": "ty-gia", "title": "Tỷ giá ngoại tệ", "blocks": [["p", "Sổ gốc luôn là **nguyên tệ** (USD…); tỷ giá chỉ dùng để quy đổi ra **VND** và tính chênh lệch tỷ giá. Tỷ giá tính theo **VND cho 1 đơn vị ngoại tệ**, tối đa 4 số lẻ."], ["ol", ["Menu **Tỷ giá**: nhập tay theo ngày (ngoại tệ, ngày, tỷ giá) hoặc bấm **Lấy từ Google Finance**. Bấm một dòng trong danh sách để sửa lại.", "**Phiếu thu/chi ngoại tệ**: tỷ giá lấy theo **ngày hiệu lực (ngày thực thu/chi)**. Có thể nhập ngay ở ô Tỷ giá trên phiếu; bỏ trống thì hệ thống dùng bảng Tỷ giá của ngày đó.", "**Chứng từ công nợ ngoại tệ nhập trực tiếp**: tỷ giá theo ngày chứng từ, cùng cách trên.", "Thứ tự ưu tiên: **nhập tay** → bảng Tỷ giá (nhập tay trước, Google sau) → tự lấy **giá đóng cửa Google Finance** (phiên gần nhất không sau ngày đó, lưu lại vào bảng) → nếu vẫn không có thì báo thiếu và yêu cầu nhập tay.", "**Phiếu chi từ quỹ ngoại tệ** ghi sổ theo **tỷ giá bình quân gia quyền di động** của quỹ (tài khoản quỹ ngoại tệ khai ở Danh mục): quỹ = số dư đầu kỳ (theo tỷ giá ngày đầu sổ) + các phiếu thu theo tỷ giá ngày thực thu; mỗi lần chi lấy theo bình quân hiện tại nên quỹ không lãi/lỗ khi chi. Xem tồn quỹ, sổ quỹ, tính lại bình quân khi bổ sung phiếu thu lùi ngày ở màn **Tỷ giá ngoại tệ → Quỹ ngoại tệ**. Chuyển nội bộ giữa hai quỹ ngoại tệ cùng loại: lập phiếu chuyển ở cùng màn, người khác ghi nhận; quỹ đi xuất theo bình quân, quỹ nhận nhập đúng giá trị VND đó. Mua/bán ngoại tệ (đổi giữa quỹ ngoại tệ và quỹ VND): bán ghi giá vốn bình quân và lãi/lỗ tỷ giá vào bút toán chênh lệch; mua nhập quỹ đúng số VND đã trả. Sổ quỹ từng tài khoản (tiền mặt, ngân hàng, USD…) ở menu **Tiền và thanh toán → Sổ quỹ**, in được và xuất Excel. **Đối chiếu ngân hàng**: dán sao kê, hệ thống ghép với sổ quỹ theo chiều/số tiền/ngày, phần còn lại là khoản chưa lên sao kê hoặc chỉ có trên sao kê; chênh lệch = 0 mới xác nhận; khoản đã khớp không hiện lại kỳ sau. **Kiểm kê quỹ**: đếm theo mệnh giá, so với sổ quỹ cuối ngày, chênh lệch phải giải trình, người khác xác nhận, in biên bản. Có thể đổi về tính theo tỷ giá ngày chi ở cùng màn (quyền cấp tỷ giá). **Quy tắc kiểm kê thừa/thiếu:** thiếu xuất theo bình quân; **thừa nhập theo tỷ giá bình quân của quỹ** (không lãi/lỗ trên quỹ; chỉ khi quỹ chưa có bình quân mới dùng tỷ giá ngày kiểm kê). **Tính lại bình quân:** nếu có chứng từ bị ảnh hưởng nằm trong **kỳ đã khóa**, hệ thống từ chối cả lượt (không tính lại một phần) — mở khóa kỳ theo quy trình rồi tính lại.", "Khi **phân bổ thu/chi**, hệ thống tính chênh lệch tỷ giá đã thực hiện = số nguyên tệ phân bổ × (tỷ giá ngày thu/chi − tỷ giá ngày chứng từ). Phải thu: tăng giá là lãi; phải trả: tăng giá là lỗ. Đảo phân bổ thì đảo theo tỷ lệ.", "Báo cáo **R13 – Chênh lệch tỷ giá đã thực hiện** và **R14 – Công nợ ngoại tệ quy đổi VND tại ngày chốt** (kèm chênh lệch chưa thực hiện để tham khảo).", "**Bút toán chênh lệch tỷ giá** (menu Tỷ giá, theo tháng): hệ thống gom chênh lệch đã thực hiện của tháng và đánh giá lại công nợ ngoại tệ cuối tháng theo tỷ giá ngày cuối tháng; tạo bản **nháp**, người khác có quyền duyệt **ghi nhận**; tháng sau tự đảo phần đánh giá lại. Kỳ đã khóa thì không ghi được; ghi sai thì đảo kèm lý do.", "**Bảng kê GTGT** (R10/R11): hóa đơn ngoại tệ được quy đổi VND theo tỷ giá ngày hóa đơn trong bảng Tỷ giá; thiếu tỷ giá thì không kê và có ghi chú. Kế toán thuế cần đối chiếu với tỷ giá quy định."]], ["tip", "Chứng từ tạo từ PO/Cost, nhập hàng loạt hoặc XML được gắn tỷ giá theo ngày chứng từ khi **ghi nhận** (tự lấy Google nếu thiếu). Chứng từ cũ: bấm **Điền tỷ giá cho chứng từ ngoại tệ cũ** ở menu Tỷ giá. Nếu vẫn thiếu, chênh lệch ghi 0 và có cảnh báo — hãy nhập tỷ giá ngày đó."], ["warn", "Ứng dụng chỉ lập bút toán chênh lệch dạng bảng kê để kế toán hạch toán (chưa có hệ thống tài khoản, chưa tự đẩy sang phần mềm kế toán). Google Finance có thể chậm hoặc không có dữ liệu — luôn kiểm tra tỷ giá hệ thống tự lấy (nguồn hiển thị trên phiếu và trong menu Tỷ giá)."]]}, {"id": "nhac-no", "title": "10. Nhắc nợ và theo dõi", "blocks": [["ul", ["Mở **Nhắc nợ** để xem nợ đến hạn, quá hạn theo nhóm tuổi nợ: Chưa đến hạn · 1–30 · 31–60 · 61–90 · Trên 90 ngày · Thiếu ngày đến hạn.", "Với từng khoản có thể ghi **theo dõi**: cam kết thanh toán, tranh chấp, ghi chú, đã liên hệ; sau đó đóng theo dõi.", "**Xem trước và gửi thư nhắc nợ** tới email liên hệ của đối tác; nội dung gồm danh sách chứng từ và thông tin ngân hàng. Mỗi lần gửi được ghi vào lịch sử theo 3 bước: \"chưa xác nhận đã gửi\" → \"đã gửi\" hoặc \"gửi thất bại\". Bấm gửi hai lần cùng một thư không gửi trùng; nếu thất bại, đóng cửa sổ và soạn lại.", "Hệ thống tự gửi bản tổng hợp nợ quá hạn mỗi sáng nếu đã cấu hình email cảnh báo.", "Khoản còn nợ chưa có ngày đến hạn hiển thị **\"Chưa xác định hạn\"**: không tự kết luận là quá hạn, nằm riêng trong nhóm tuổi nợ và trong cảnh báo; bổ sung hạn (hoặc điều khoản đối tác) để khoản vào nhóm tuổi nợ đúng."]]]}, {"id": "dau-ky", "title": "11. Dư đầu kỳ", "blocks": [["ol", ["Mở **Dư đầu kỳ**, nhập (dán) tối đa 1.000 dòng mỗi lần. Mỗi dòng thuộc một loại: **AR** (phải thu), **AP** (phải trả), **CASH** (quỹ/tài khoản) hoặc **CREDIT** (khoản ứng/có của đối tác), tại **ngày đầu sổ**.", "Lưu nháp, kiểm tra tổng, rồi gửi duyệt.", "Người duyệt khác (không phải người lập) kiểm tra bản xem trước, xác nhận đúng tổng hợp rồi ghi nhận. Hệ thống tạo chứng từ mở đầu (số **OPN-...**) cho AR/AP, phiếu ứng trước cho CREDIT và số dư quỹ cho CASH.", "Quy tắc kiểm tra: mỗi tài khoản quỹ (CASH) chỉ một dòng số dư; ngày chứng từ gốc phải trước ngày đầu sổ; hạn thanh toán không được trước ngày chứng từ; đối tác đã ngừng sử dụng bị từ chối. Khi người duyệt bấm ghi nhận, hệ thống kiểm tra lại toàn bộ dòng theo danh mục hiện tại; nếu có lỗi sẽ chặn và nêu dòng nào, người duyệt từ chối để người lập sửa.", "Dư đầu kỳ là số liệu toàn công ty: chỉ người có phạm vi toàn bộ đối tác và nhóm nghiệp vụ được lập, gửi duyệt, từ chối, ghi nhận. Người bị giới hạn phạm vi khi xem chỉ thấy các dòng thuộc phạm vi của mình.", "Sau khi đã ghi nhận không sửa trực tiếp: công nợ sai thì sửa bằng chứng từ điều chỉnh hoặc đảo; số dư quỹ đầu kỳ sai cần quản trị xử lý."]], ["warn", "Ngày đầu sổ mặc định là 01/01/2026, do quản trị đặt khi cài đặt và không đổi trên giao diện sau khi đã có dữ liệu. Không ghi chứng từ trước ngày này."]]}, {"id": "sao-ke", "title": "12. Nhập sao kê ngân hàng / sổ thu chi tiền mặt", "blocks": [["ol", ["Mở **Nhập sao kê**. Một mẫu dùng chung cho **ngân hàng và tiền mặt**: phân biệt bằng cột *Tài khoản quỹ*. Bấm **⬇ Tải file mẫu (.xlsx)** để có tệp với danh sách quỹ và đối tác THẬT của công ty (cũng có mẫu CSV). Cột: Ngày | Tài khoản quỹ | Thu | Chi | Mã GD ngân hàng | Đối tác | Diễn giải | Số HĐ/Mã dịch vụ; mỗi dòng chỉ Thu **hoặc** Chi; ngày dd/MM/yyyy (ô ngày Excel cũng được).", "Điền xong, bấm **Chọn tệp** (nhận cả **.xlsx**, đọc sheet *Nhập liệu*, lẫn **.csv** UTF-8) hoặc dán nội dung, rồi **Xem trước**. Hệ thống báo dòng hợp lệ, cảnh báo trùng với phiếu đã có (cùng ngày/số tiền/mã giao dịch), thiếu thông tin. Tệp đã nhập trước đó (cùng nội dung) bị chặn. Tối đa 1.000 dòng một tệp.", "Với từng dòng chọn **Chấp nhận** hoặc **Loại dòng**; dòng chưa quyết định thì chưa ghi. Mọi dòng được ghi **phải có đối tác** đúng vai trò (Thu = khách hàng, Chi = nhà cung cấp); chọn tay ở bước này nếu hệ thống chưa nhận ra.", "Người có quyền duyệt (khác người nhập) xác nhận ghi lô. Hệ thống tạo **phiếu thu/chi đã ghi nhận** theo ngày giao dịch, mục đích Thanh toán, nguồn \"Nhập từ tệp\". Lô làm **quỹ tiền mặt** âm/vượt số dư thì bị chặn (xem mục *Quỹ tiền mặt*). Sau đó vào Thu/Chi để phân bổ."]], ["warn", "Nhập, rà soát và ghi sao kê chỉ dành cho người có phạm vi toàn bộ đối tác và nhóm nghiệp vụ; người bị giới hạn chỉ xem được các dòng thuộc đối tác trong phạm vi. Khi ghi lô, hệ thống kiểm tra lại trùng với phiếu đã có hoặc dòng đã ghi (kể cả từ lô khác); nếu có sẽ chặn và yêu cầu tải lại để quyết định lại."], ["tip", "**Chi phí không hóa đơn** (phí ngân hàng, tiền xe, chi lặt vặt): dùng một nhà cung cấp riêng, ví dụ \"CHI PHÍ KHÔNG HÓA ĐƠN\", làm Đối tác và ghi \"KHÔNG HÓA ĐƠN\" ở Diễn giải. Tiền vào sổ quỹ đúng số, không có thuế GTGT. Chi tiết xem mục *Chi phí không có hóa đơn GTGT*."], ["tip", "Có thể hủy cả lô nếu chưa ghi."]]}, {"id": "doi-chieu", "title": "13. Đối chiếu với file Excel", "blocks": [["ul", ["Mở **Đối chiếu Excel**, tải file Excel công nợ đang dùng.", "Hệ thống đọc phần phải thu, phải trả, so với số liệu trong ứng dụng theo đối tác, số hóa đơn và tiền tệ.", "Kết quả liệt kê khớp, lệch và thiếu để bạn xử lý. Chức năng chỉ so sánh, **không sửa dữ liệu**.", "Hệ thống đọc file theo **mẫu cột cố định** (sheet FWD, CBT, NCC, BMT). Nếu một sheet có dữ liệu mà không đọc được dòng nào, báo cáo có cảnh báo \"file có thể không đúng mẫu\". Số hóa đơn, mã dịch vụ so khớp không phân biệt hoa/thường, dấu cách, dấu gạch và số 0 đầu. Phải thu của nhóm/tiền tệ không có trong file mẫu được ghi chú riêng, không tính vào so sánh."]]]}, {"id": "bao-cao", "title": "14. Báo cáo", "blocks": [["table", ["Mã", "Tên báo cáo"], [["R01", "Báo cáo tổng hợp công nợ cuối ngày"], ["R02", "Bảng chi tiết công nợ phải thu khách hàng"], ["R03", "Bảng chi tiết công nợ phải trả NCC/shipper"], ["R04", "Bảng công nợ theo mã dịch vụ và đợt"], ["R05", "Bảng quyết toán công nợ"], ["R06", "Biên bản đối chiếu/xác nhận công nợ"], ["R07", "Báo cáo tuổi nợ"], ["R08", "Sổ thu/chi và phân bổ thanh toán"], ["R09", "Báo cáo doanh thu – chi phí – lãi gộp theo đơn hàng/mã dịch vụ (mỗi đơn tách từng mã dịch vụ kèm số HSDV và bộ phận thực hiện; cuối mỗi tiền tệ có bảng tổng hợp theo mã)"], ["R10", "Bảng kê thuế GTGT hàng hóa, dịch vụ bán ra (menu Thuế GTGT)"], ["R11", "Bảng kê thuế GTGT hàng hóa, dịch vụ mua vào (menu Thuế GTGT)"], ["R12", "Dự báo dòng tiền thu – chi theo hạn thanh toán (từng tiền tệ)"]]], ["ul", ["Chọn báo cáo, đặt tham số (ngày chốt, đối tác, tiền tệ...) và chạy. **Xuất** ra Excel hoặc PDF.", "**Phát hành bản chốt**: lưu cố định một báo cáo tại thời điểm đó (có mã băm và phiên bản) để tải lại sau này.", "R09 tính lãi gộp theo đơn hàng, từng tiền tệ riêng, CHỈ từ khoản đã lập hóa đơn (có hóa đơn mới ghi nhận doanh thu, chi phí): khoản chưa/đang lập hóa đơn không vào lãi. Khi có tiền tệ khác VND, cuối báo cáo có phần Quy đổi VND (tham khảo): mỗi lần ghi nhận quy đổi theo tỷ giá đã lưu trên chính chứng từ đó. R09 có thể lọc theo khách hàng, nhóm, tiền tệ, khoảng ngày đơn, **một đơn hàng cụ thể** (ô Đơn hàng cụ thể) hoặc **tìm theo một phần số đơn/số PO**; lọc theo đơn thì không hiện dòng Chi phí chung và tiêu đề ghi đơn đang lọc. **R02/R03 theo đối tác:** từng dòng chứng từ chỉ hiện phần đã phân bổ vào chứng từ đó; tiền thu/chi đã ghi nhận nhưng chưa phân bổ (ứng trước) hiện thành dòng riêng cuối mỗi đối tác, kèm dòng đã thu/đã trả gồm ứng trước và số còn lại sau khi trừ ứng trước. Màn Tổng hợp công nợ (tab Khách hàng/NCC) có cột Còn nợ ròng đã trừ tiền chưa phân bổ. **Công nợ tổng thể quy đổi VND:** Tổng quan có thẻ Tổng công nợ quy đổi VND (phải thu, phải trả, ròng); Tổng hợp công nợ có công tắc Hiển thị (Quy đổi VND / Từng tiền tệ / Chỉ USD…); R01, R02/R03 và R07 có khối Quy đổi VND ở cuối. Quy đổi theo giá trị ghi sổ: số còn nợ nguyên tệ × tỷ giá ĐÃ LƯU trên từng chứng từ (tiền chưa phân bổ theo số VND đã lưu trên phiếu), không dùng tỷ giá ngày chốt (đánh giá lại cuối kỳ xem R14); chứng từ chưa có tỷ giá và bảng Tỷ giá cũng không có thì không tính và được báo rõ. Sau khi cập nhật bản mới, bấm Làm mới (tính lại ngay) ở Tổng hợp công nợ/Tổng quan một lần để bảng tổng hợp có số quy đổi.", "R02/R03 (chi tiết phải thu/phải trả) có ô \"Đơn hàng cụ thể\" và \"Tìm theo số đơn / PO\": chỉ liệt kê chứng từ có dòng phí gắn với PO đó (kể cả khoản chia nhiều đơn); tiêu đề ghi \"Đơn hàng: …\". Khi lọc theo đơn, tiền ứng trước không gắn với đơn nên không đưa vào.", "Tỷ giá mua/bán: ở menu Tỷ giá có thể nhập thêm tỷ giá MUA và BÁN của ngân hàng (không bắt buộc). Đánh giá lại cuối kỳ (R14 và bút toán chênh lệch) dùng tỷ giá MUA cho phải thu và quỹ ngoại tệ, tỷ giá BÁN cho phải trả; chưa nhập thì dùng tỷ giá chung và có cảnh báo. R14 tách cột \"đã quy đổi\" và \"chưa quy đổi (thiếu tỷ giá)\"; tỷ giá cuối kỳ cũ hơn 7 ngày cũng được cảnh báo.", "**Thuế GTGT (R10 bán ra, R11 mua vào)**: mở từ menu **Thuế GTGT**. Chọn khoảng ngày (mặc định từ đầu tháng đến ngày chốt, **theo ngày hóa đơn**), có thể lọc nhóm. Bảng kê gom theo thuế suất (0%, 5%, 8%, 10%…, không chịu thuế) kèm ký hiệu, số, ngày hóa đơn, tên và mã số thuế đối tác. Chỉ gồm chứng từ **đã ghi nhận**, hóa đơn **VND**; dòng chi hộ không kê. Hóa đơn bị đảo hiện cả dòng gốc và dòng đảo (số âm); điều chỉnh tăng/giảm và dòng **chưa xác nhận thuế** nằm riêng, không cộng vào tổng (chưa xác nhận thuế sẽ chặn \"Phát hành bản chốt\"). Hóa đơn ngoại tệ, chứng từ chưa ghi nhận và thiếu mã số thuế được ghi chú cuối báo cáo. Bảng mua vào chưa phân loại \"đủ điều kiện khấu trừ\": kế toán thuế rà trước khi kê khai.", "Các báo cáo đều tính **tại ngày chốt** đã chọn: R05 và R09 chỉ gồm chứng từ, điều chỉnh, khoản phát sinh có ngày đến ngày chốt. R05 có thêm các dòng đảo/điều chỉnh của kỳ quyết toán; R06 ghi thêm phiếu thu/chi chưa phân bổ (ứng trước) và số dư sau khi trừ ứng trước; hai cột \"chưa lập/nhận HĐ\" của R09 là số đã gồm thuế.", "**Bản chốt** của báo cáo không gắn đối tác (R01, R02, R03, R07, R08, R09) chỉ người có phạm vi toàn bộ đối tác và nhóm kinh doanh, hoặc chính người phát hành, mới xem và tải được. Bản chốt gắn đối tác (R04, R05, R06) theo phạm vi đối tác.", "**Sổ thu/chi quỹ (R08)** chỉ dành cho người có phạm vi toàn bộ đối tác và nhóm kinh doanh, vì tồn quỹ không chia theo đối tác.", "**Cơ sở ngày:** mặc định báo cáo tính theo ngày ghi nhận (khớp sổ đã chốt). Có thể chọn **Ngày chứng từ** để xem/đối chiếu; báo cáo ghi nhãn rõ cơ sở ngày, số có thể khác sổ đã chốt, và **không phát hành bản chốt** ở chế độ này. Quản trị chạy hàm **auditLedgerDates()** để liệt kê chứng từ có ngày ghi nhận khác tháng với ngày chứng từ (dữ liệu cũ chịu ảnh hưởng) — chỉ liệt kê, không sửa dữ liệu.", "R09 có cột trạng thái số liệu: **\"Chưa đủ dữ liệu\"** khi có doanh thu dịch vụ nhưng chưa có chi phí; **\"Lãi gộp theo khoản đã ghi nhận – …\"** khi còn khoản chưa/đang lập hóa đơn, số hộ chưa đối ứng hoặc chi hộ chờ xác minh. Chi phí chưa gắn mã dịch vụ/HSDV nằm ở dòng \"(chưa gắn mã)\" làm danh sách chờ phân bổ.", "R09 dựng lại trạng thái hóa đơn **theo ngày chốt** từ lịch sử liên kết hóa đơn–khoản: đảo hóa đơn hoặc tạo hóa đơn nháp sau ngày chốt **không làm đổi** R09 của các ngày trước đó. **Điều chỉnh tăng/giảm đã ghi nhận** (ví dụ giảm giá dịch vụ) được cộng vào doanh thu/chi phí của khoản gốc từ ngày hiệu lực của điều chỉnh; R09 trước ngày đó giữ nguyên. Điều chỉnh không tách VAT nên phần giảm trừ vào số trước thuế bằng đúng số điều chỉnh. Hóa đơn bị xóa hoặc bị từ chối sau ngày chốt cũng không làm đổi R09 của các ngày trước (bản ghi đã xóa được giữ để dựng lịch sử; khoản thuộc hóa đơn bị từ chối vẫn tính là \"đang lập\" cho đến khi hóa đơn được xóa). Khi điều chỉnh một khoản chi phí chia nhiều đơn, phần điều chỉnh được chia cho các đơn sao cho **tổng các phần đúng bằng số điều chỉnh gốc** (phần dư chia theo phần lẻ lớn nhất).", "**R12 – Dự báo dòng tiền thu – chi theo hạn:** xếp các khoản còn nợ đã ghi nhận theo ngày dự kiến thanh toán (nếu đã nhập) hoặc ngày đến hạn: quá hạn, trong 7 ngày, 8–14, 15–30, 31–60, 61–90, trên 90 ngày; mỗi tiền tệ một khối, có chênh lệch thu – chi và lũy kế. Khoản **chưa xác định hạn** nằm riêng, KHÔNG tính vào lũy kế (cần bổ sung hạn). Tiền khách đã thu và tiền đã chi NCC chưa phân bổ vào chứng từ được trừ ở dòng bù trừ riêng (kèm dòng \\\"dự kiến sau bù trừ\\\"); có thể chia theo tuần (4 tuần đầu). Chưa tính thuế, tỷ giá, lương và chi phí cố định.", "**Mẫu PDF/Excel:** tiêu đề doanh nghiệp (khai báo ở Thiết lập: tên, địa chỉ, MST, điện thoại, email, logo, tài khoản ngân hàng), mã mẫu, kỳ/ngày chốt, bộ lọc và cơ sở ngày, nhãn BẢN NHÁP/BẢN CHỐT, khối TÓM TẮT theo từng tiền tệ, băng tiêu đề gọn 3 hàng (công ty · tên báo cáo · trạng thái · mã mẫu · tiêu đề cột) lặp ở mọi trang in, điều kiện lọc và tóm tắt chỉ ở trang đầu, dòng nhóm/tổng riêng, số âm màu đỏ, bằng chữ, ghi chú, khối chữ ký và chân trang. Báo cáo rộng (trên 14 cột, như R09) xuất giấy A3. Tệp Excel có thêm trang \"Hướng dẫn đọc\" (cách tính, tham số, lưu ý)."]]]}, {"id": "ky", "title": "15. Kỳ kế toán", "blocks": [["ol", ["Mở **Kỳ**, bấm **Kiểm tra điều kiện khóa** để xem danh sách việc còn dang dở (chứng từ chưa ghi nhận...).", "Khi đủ điều kiện, người có quyền **khóa kỳ**. Kỳ đã khóa không cho ghi chứng từ, phiếu hay phân bổ có ngày hiệu lực trong kỳ.", "Không khóa được kỳ trong tương lai, cũng không khóa được tháng trước tháng đầu sổ. Phải khóa các kỳ theo thứ tự (kỳ trước chưa khóa thì chưa khóa được kỳ sau), và dư đầu kỳ đang nháp hoặc chờ duyệt cũng chặn khóa kỳ.", "Cần sửa: dùng **chứng từ điều chỉnh** vào kỳ đang mở. Nếu bắt buộc phải mở lại: Kế toán trưởng **yêu cầu mở lại** kèm lý do, quản trị hệ thống **xác nhận mở lại**.", "Khóa kỳ chặn **mọi đường ghi** vào kỳ đã khóa: chứng từ, phiếu thu/chi, phân bổ, điều chỉnh, khoản phát sinh (lưu/hủy/lập hóa đơn), đơn hàng và nhập hàng loạt. Khi sửa ngày hoặc chuyển hồ sơ, hệ thống kiểm cả kỳ cũ lẫn kỳ mới. Nghiệp vụ phát sinh sau khi khóa: lập chứng từ điều chỉnh ở kỳ đang mở, hoặc mở lại kỳ theo quy trình trên."]]]}, {"id": "sao-luu", "title": "16. Sao lưu và khôi phục", "blocks": [["ul", ["Hệ thống **tự sao lưu hằng ngày lúc 01:00**. Có thể bấm **Sao lưu** thủ công; chỉ sao lưu khi không còn thao tác ghi dở.", "Mặc định giữ **14 bản gần nhất**, luôn giữ tối thiểu 3 bản đã xác minh; ghi chú có chữ **KEEP** để bảo vệ bản đó.", "Bấm **Kiểm tra** để xác minh bản sao lưu bằng mã băm và số dòng.", "Khi sao lưu, hệ thống còn so bản sao với dữ liệu gốc; bản sao lệch bị đánh dấu thất bại và báo cho quản trị.", "Bản sao lưu thủ công và bản tự động trước khi khôi phục được tính cửa sổ lưu riêng, không làm mất các bản hằng ngày.", "Cảnh báo (sao lưu thất bại, khôi phục) gửi tới email đặt ở **ALERT_EMAIL**; nếu chưa đặt thì gửi tới email của tài khoản chạy hệ thống."]], ["p", "**Khôi phục dữ liệu cần hai người:**"], ["ol", ["Người thứ nhất bấm **Chuẩn bị khôi phục**, nhập lý do. Hệ thống tự sao lưu trước, đưa vào **chế độ bảo trì** (chặn mọi thao tác ghi) và tạo bản ứng viên, đồng thời cho biết số thao tác sẽ mất kể từ thời điểm sao lưu.", "Người thứ hai (vai trò Kế toán trưởng, khác người thứ nhất) kiểm tra rồi bấm **Chuyển sang bản khôi phục**. Nếu số kiểm soát sau khôi phục không khớp, hệ thống tự quay lại dữ liệu cũ.", "Có thể **Quay lại dữ liệu cũ** (chỉ Kế toán trưởng, phải nhập lý do, không làm được khi đang có yêu cầu khôi phục) hoặc **Hủy khôi phục** (gỡ chế độ bảo trì, tệp ứng viên được bỏ vào thùng rác) khi cần.", "Có thể khôi phục bản sao lưu của phiên bản cũ: hệ thống tự bổ sung các cột mới trước khi kiểm tra. Nếu bước kiểm tra gặp lỗi bất kỳ, hệ thống tự quay lại dữ liệu cũ và giữ yêu cầu khôi phục để chị xem lại hoặc hủy."]], ["warn", "Khi hệ thống ở chế độ bảo trì, mọi thao tác ghi bị chặn với thông báo \"Hệ thống đang bảo trì/khôi phục dữ liệu\". Chỉ người có quyền khôi phục mới gỡ được."]]}, {"id": "khoi-tao-cong-ty-moi", "title": "Khởi tạo dữ liệu cho công ty mới", "blocks": [["p", "Dùng khi muốn áp dụng ứng dụng cho **một công ty khác** với bộ dữ liệu **trống**. Menu **Quản trị hệ thống → Khởi tạo công ty mới** (cần quyền khôi phục: Quản trị hoặc Kế toán trưởng/Người duyệt)."], ["warn", "Dữ liệu công ty hiện tại **không bị xóa**: ứng dụng tạo bộ Google Sheets **mới** rồi chuyển sang dùng bộ đó. Bộ cũ giữ nguyên trong Drive và quay lại được."], ["table", ["", "Nội dung"], [["Giữ lại", "Người dùng và quyền, danh mục (loại phí, nhóm nghiệp vụ, mã dịch vụ, tiền tệ — nếu chọn giữ), bản sao lưu, cấu hình chung (tỷ giá bình quân, quy trình duyệt…)"], ["Bắt đầu lại", "Đối tác, đơn hàng, chứng từ, phiếu thu/chi, tài khoản quỹ, số dư đầu kỳ, tỷ giá, kỳ kế toán, số thứ tự chứng từ, bản nháp"], ["Đặt mới", "Tên công ty, tên viết tắt, mã số thuế, ngày đầu sổ"], ["Dùng chung", "Nhật ký hệ thống (có ghi sự kiện khởi tạo)"]]], ["ol", ["Người thứ nhất vào màn **Khởi tạo công ty mới**, nhập tên công ty, mã số thuế, **ngày đầu sổ**, lý do, chọn giữ hay không giữ danh mục, gõ đúng cụm **KHOI TAO MOI** rồi **Gửi yêu cầu**. Chưa có gì thay đổi.", "Người thứ hai (**Kế toán trưởng/Người duyệt**, khác người gửi) mở lại màn đó, kiểm tra yêu cầu rồi bấm **Xác nhận khởi tạo** và gõ lại cụm xác nhận. Hệ thống bật bảo trì, **tự sao lưu**, tạo bộ dữ liệu mới, chuyển sang bộ mới và kiểm tra. Nếu có lỗi, hệ thống tự quay lại dữ liệu cũ.", "Tải lại trang. Nhập **tài khoản quỹ**, **đối tác**, **số dư đầu kỳ** của công ty mới (có thể dùng Nhập danh mục/Nhập sao kê).", "Muốn quay lại công ty cũ: cùng màn, mục **Quay lại bộ dữ liệu trước** (Kế toán trưởng/Người duyệt, có lý do). Quay lại lần nữa để về bộ mới."]], ["tip", "Mỗi người dùng đã được mời vẫn đăng nhập được ở bộ mới. Nếu công ty mới có người dùng khác, vào *Người dùng và phạm vi* để mời/khóa sau khi khởi tạo."], ["warn", "Dữ liệu cũ và mới nằm ở **hai bộ Sheets khác nhau**; thao tác sau khi chuyển chỉ ghi vào bộ đang dùng. Nhật ký hệ thống là chung nên có lẫn sự kiện của cả hai công ty. Mã băm HMAC, địa chỉ Backend/Gateway không đổi."]]}, {"id": "quan-tri", "title": "17. Người dùng, danh mục và nhật ký", "blocks": [["ul", ["**Người dùng**: mời người dùng bằng email Google, gán vai trò, phạm vi dữ liệu; tạm khóa/mở lại.", "**Danh mục và cấu hình**: loại phí, **mã dịch vụ** (mỗi mã có thêm cột **bộ phận thực hiện**; PO chọn một hoặc nhiều mã; bản có sẵn 5 mã theo bộ phận: CFN, FWD, CBT, MV, TRD; mã đã dùng không đổi được, chỉ ngừng dùng), tài khoản quỹ, tiền tệ, nhóm kinh doanh...; cấu hình ngày đầu sổ, số bản sao lưu giữ...", "**Mã danh mục đang dùng không đổi được**: loại phí, nhóm kinh doanh, tiền tệ, tài khoản quỹ đã có dữ liệu thì chỉ sửa tên hoặc ngừng sử dụng; tiền tệ đã phát sinh dữ liệu không đổi số chữ số thập phân. Không đổi loại của mục đã tạo.", "Khi lưu người dùng, phạm vi dữ liệu được kiểm tra (đối tác, nhóm nghiệp vụ phải tồn tại; nhãn hợp lệ). Không tự đổi vai trò, trạng thái hay phạm vi của chính mình.", "**Nhật ký**: mọi thay đổi và các lần bị từ chối truy cập (ai, lúc nào, làm gì, trước/sau). Dùng để truy vết và kiểm soát. Số tài khoản và điện thoại đối tác được che (chỉ còn 4 số cuối) trong nhật ký. Khi lọc/tìm, hệ thống chỉ quét 20.000 dòng gần nhất và hiện thông báo nếu bị cắt. **Lưu trữ tự động:** mỗi ngày lúc 03:00 hệ thống chuyển lịch sử giao dịch cũ (mặc định trên 90 ngày) và nhật ký cũ (mặc định trên 24 tháng) sang tệp bảng tính CONGNO_ARCHIVE_SysTx_<năm> và CONGNO_ARCHIVE_AuditLog_<năm> trong Drive của chủ hệ thống, sau khi kiểm tra bản lưu khớp mới xóa khỏi bảng đang dùng. Số ngày/tháng giữ chỉnh ở Danh mục → Thông tin doanh nghiệp (tối thiểu 30 ngày và 12 tháng). Dữ liệu đã lưu trữ không hiện trong màn Nhật ký; mở trực tiếp tệp lưu trữ khi cần tra cứu."]]]}, {"id": "loi", "title": "18. Thông báo thường gặp và cách xử lý", "blocks": [["table", ["Thông báo", "Nguyên nhân", "Cách xử lý"], [["Hệ thống đang bận / Dữ liệu đang được cập nhật", "Có người khác đang ghi", "Chờ vài giây rồi thử lại. Không cần bấm nhiều lần: ứng dụng tự chống ghi trùng"], ["Bản ghi đã được người khác thay đổi. Hãy tải lại", "Hai người cùng sửa một bản ghi", "Tải lại màn hình, xem bản mới nhất rồi sửa lại"], ["Người lập/gửi duyệt không được tự duyệt", "Chặn tự duyệt", "Nhờ người duyệt khác"], ["Chứng từ đang ở trạng thái ..., không thực hiện được", "Sai bước quy trình hoặc đã có người xử lý", "Tải lại để xem trạng thái hiện tại"], ["Chứng từ nghi trùng", "Có chứng từ tương tự", "Kiểm tra, nếu đúng là hợp lệ thì xác nhận kèm lý do"], ["Còn phân bổ thanh toán", "Đảo chứng từ/phiếu khi còn phân bổ", "Đảo phân bổ trước"], ["Kỳ đã khóa", "Ngày hiệu lực nằm trong kỳ khóa", "Dùng chứng từ điều chỉnh vào kỳ đang mở hoặc xin mở lại kỳ"], ["Quá nhiều yêu cầu", "Gửi quá nhanh", "Chờ khoảng một phút"], ["Hệ thống đang bảo trì/khôi phục", "Đang khôi phục dữ liệu", "Chờ quản trị gỡ chế độ bảo trì"], ["Sheet ... sai tiêu đề cột", "Có người sửa cấu trúc bảng tính dữ liệu", "Báo quản trị: khôi phục tiêu đề cột, chạy lại ensureSchema()"], ["Mã ... đã được dùng trong ...: không đổi mã", "Mục danh mục đã có dữ liệu", "Chỉ sửa tên hoặc ngừng sử dụng; muốn mã khác thì tạo mục mới"], ["Khoản chi hộ không tính VAT", "Dòng chi hộ chọn thuế suất", "Chọn \"không chịu thuế\" cho dòng chi hộ"], ["Không khóa kỳ trong tương lai / kỳ trước tháng đầu sổ", "Chọn nhầm tháng khi khóa", "Chọn lại kỳ đang kết thúc"], ["Dữ liệu danh mục đã đổi từ lúc lưu (dư đầu kỳ)", "Đối tác hoặc danh mục đổi sau khi lưu nháp", "Từ chối, người lập sửa các dòng được nêu rồi gửi lại"], ["Không đọc được bản khôi phục. Đã tự quay lại DB cũ", "Bản ứng viên lỗi hoặc lệch số kiểm soát", "Dữ liệu đang dùng không đổi; hủy hoặc chuẩn bị lại khôi phục"], ["Chứng từ đã có điều chỉnh (khi đảo)", "Còn bản điều chỉnh gắn với chứng từ", "Xóa bản nháp điều chỉnh hoặc lập điều chỉnh ngược trước"], ["Giảm quá số dư còn lại của dòng", "Điều chỉnh giảm lớn hơn số dư, tính cả bản nháp khác", "Giảm số tiền hoặc xử lý bản nháp đang chờ"], ["Sao kê: từ lúc xem trước đã có phiếu cùng ngày/số tiền/mã giao dịch", "Phiếu trùng được tạo giữa chừng", "Tải lại lô, quyết định lại dòng đó"], ["Không đủ quyền / Ngoài phạm vi", "Vai trò hoặc phạm vi chưa cho phép", "Nhờ quản trị cấp quyền nếu cần"]]]]}, {"id": "luu-y", "title": "19. Quy tắc làm việc nên nhớ", "blocks": [["ul", ["Kiểm tra ngày chốt trước khi đọc số dư/báo cáo.", "Không nhập hai lần cùng một hóa đơn; đọc kỹ cảnh báo nghi trùng.", "Khi bấm lưu mà chưa thấy phản hồi, **đừng nhập lại**: mở lại danh sách để kiểm tra trước.", "Sửa sai bằng **đảo/điều chỉnh**, không xóa chứng từ đã ghi nhận.", "Phiếu thu/chi luôn nên được phân bổ để tuổi nợ phản ánh đúng.", "Không chia sẻ tài khoản Google đã được cấp quyền.", "Mỗi thao tác ghi dữ liệu được ghi **nhật ký trước khi hoàn tất**; nếu hệ thống dừng giữa chừng, bộ phục hồi (mỗi 5 phút, hoặc quản trị chạy **recoverStale_**) hoàn tất hoặc hoàn tác giao dịch, không tạo bản ghi hay nhật ký trùng. Gửi lại cùng mã yêu cầu trả kết quả cũ; cùng mã nhưng nội dung khác bị từ chối; hai người cùng sửa một bản ghi thì người sau phải tải lại."]]]}, {"id": "cai-dat", "title": "20. Dành cho quản trị: cài đặt và cập nhật", "blocks": [["p", "Hệ thống gồm hai Apps Script: **Gateway** (giao diện, xác minh tài khoản Google, ký yêu cầu) và **Backend** (dữ liệu, nghiệp vụ, Web App chạy dưới quyền chủ sở hữu và chỉ nhận yêu cầu có chữ ký HMAC)."], ["ol", ["Backend: chạy **setupBackend()** một lần để tạo 2 bảng tính (dữ liệu và nhật ký), khóa HMAC, tiêu đề cột, dữ liệu mặc định và bộ kích hoạt tự động (sao lưu 01:00, dọn giao dịch dở mỗi 5 phút, tổng hợp quá hạn 08:00).", "Đặt Script Property **BOOTSTRAP_ADMIN** = email quản trị đầu tiên; tùy chọn **ALERT_EMAIL** để nhận cảnh báo.", "Deploy Backend: Execute as Me, Who has access: Anyone. Sao chép URL.", "Gateway: đặt Script Properties **BACKEND_URL** (URL trên) và **HMAC_SECRET** (giá trị ghi trong nhật ký chạy setupBackend). Deploy Web App phục vụ người dùng với **Execute as: User accessing the web app** và Who has access: Anyone with Google account (hoặc chỉ tên miền công ty): Gateway dựa vào Session.getActiveUser để lấy đúng email người đang dùng, nên KHÔNG đặt Execute as Me. Backend thì Execute as Me (quyền chủ triển khai) và chỉ nhận yêu cầu có chữ ký HMAC.", "Mỗi lần cập nhật code: lưu, chọn **Deploy → Manage deployments → Edit → New version** để chắc người dùng chạy mã mới; làm mới trình duyệt (Ctrl+F5).", "Chạy **ensureSchema()** sau khi cập nhật (bắt buộc với bản có schema 1.7, vì thêm cột cuối các bảng Đối tác, Đơn hàng (mã dịch vụ, số HSDV), Khoản phát sinh (mã dịch vụ) và Dòng chứng từ (mã dịch vụ): hàm tự thêm tiêu đề, không làm lệch dữ liệu cũ) hoặc nếu nghi ngờ ai đó sửa tiêu đề cột. Kết quả ghi ở Logger; nếu có bảng lệch phải sửa trước khi dùng.", "Cần xóa bộ nhớ đệm đọc: chạy **clearReadCache()**. Sau khi cập nhật bản có lưu trữ tự động, chạy **installTriggers()** một lần để tạo bộ kích hoạt lưu trữ 03:00 (hoặc chạy **archiveOldData()** thủ công để lưu trữ ngay).", "(Khuyến nghị) Bật dịch vụ nâng cao **Drive API** (Services → Drive API) cho Backend để tệp bảng tính tạm khi xuất báo cáo được xóa hẳn. Nếu không bật, hệ thống xóa sạch nội dung tệp tạm rồi bỏ vào thùng rác.", "**Nâng cấp từ bản cũ (schema 1.9):** (a) Sao lưu: File → Make a copy cho cả bảng tính Dữ liệu và Nhật ký (và chạy sao lưu của ứng dụng); (b) thay Backend.gs nhưng CHƯA deploy; (c) chạy ensureSchema(): bước 1 chỉ kiểm tra tiêu đề (dry-run), nếu lệch lõi thì DỪNG và không ghi gì; bước 2 chỉ thêm tiêu đề cột bổ sung ở **cuối** bảng, không đổi thứ tự, không động đến dữ liệu; chạy lại bao nhiêu lần cũng không đổi gì thêm; (d) chạy auditLedgerDates() để xem dữ liệu cũ có ngày ghi nhận khác ngày chứng từ; (e) deploy phiên bản mới. **Quay lui:** deploy lại phiên bản Backend trước (Manage deployments → chọn version cũ); các cột mới ở cuối bảng không ảnh hưởng bản cũ; nếu cần, khôi phục từ bản sao ở bước (a)."]], ["warn", "Không chia sẻ HMAC_SECRET. Không thêm/xóa/đổi thứ tự cột trong các bảng tính dữ liệu; ứng dụng ánh xạ cột theo vị trí và sẽ từ chối chạy nếu tiêu đề lệch."]]}];
function guideRich(text) {
    var f = document.createDocumentFragment();
    String(text).split(/\*\*(.+?)\*\*/).forEach(function (part, i) { if (!part)
        return; if (i % 2) {
        var b = document.createElement('b');
        b.textContent = part;
        f.appendChild(b);
    }
    else
        f.appendChild(document.createTextNode(part)); });
    return f;
}
function guideBlock(b) {
    var type = b[0], el, i;
    if (type === 'p') {
        el = document.createElement('p');
        el.appendChild(guideRich(b[1]));
    }
    else if (type === 'ul' || type === 'ol') {
        el = document.createElement(type);
        b[1].forEach(function (x) { var li = document.createElement('li'); li.appendChild(guideRich(x)); el.appendChild(li); });
    }
    else if (type === 'tip' || type === 'warn') {
        el = document.createElement('div');
        el.className = type === 'tip' ? 'gtip' : 'gwarn';
        var lead = document.createElement('b');
        lead.textContent = type === 'tip' ? 'Mẹo: ' : 'Lưu ý: ';
        el.appendChild(lead);
        el.appendChild(guideRich(b[1]));
    }
    else if (type === 'table') {
        el = document.createElement('div');
        el.className = 'gtable';
        var tb = document.createElement('table'), tr = document.createElement('tr');
        b[1].forEach(function (c) { var th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
        var thead = document.createElement('thead');
        thead.appendChild(tr);
        tb.appendChild(thead);
        var tbody = document.createElement('tbody');
        b[2].forEach(function (r) { var row = document.createElement('tr'); r.forEach(function (c) { var td = document.createElement('td'); td.appendChild(guideRich(c)); row.appendChild(td); }); tbody.appendChild(row); });
        tb.appendChild(tbody);
        el.appendChild(tb);
    }
    return el;
}
function guideFold(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
VIEWS.guide = async function () {
    var root = h('div', { class: 'guide' }), list = h('div'), items = [];
    root.appendChild(h('h1', null, 'Hướng dẫn sử dụng'));
    var q = h('input', { type: 'search', placeholder: 'Tìm trong hướng dẫn…', 'aria-label': 'Tìm trong hướng dẫn' });
    var bar = h('div', { class: 'guide-tools' }, q);
    bar.appendChild(h('button', { type: 'button', onclick: function () { items.forEach(function (x) { x.d.open = true; }); } }, 'Mở tất cả'));
    bar.appendChild(h('button', { type: 'button', onclick: function () { items.forEach(function (x) { x.d.open = false; }); } }, 'Thu gọn'));
    bar.appendChild(h('button', { type: 'button', onclick: function () {
            items.forEach(function (x) { x.d.style.display = ''; x.d.open = true; });
            document.body.classList.add('print-guide');
            var done = function () { document.body.classList.remove('print-guide'); window.removeEventListener('afterprint', done); };
            window.addEventListener('afterprint', done);
            window.print();
        } }, 'In hướng dẫn'));
    root.appendChild(bar);
    GUIDE.forEach(function (sec, idx) {
        var d = document.createElement('details'), sm = document.createElement('summary'), body = document.createElement('div');
        d.id = 'guide-' + sec.id;
        if (idx === 0)
            d.open = true;
        sm.textContent = sec.title;
        body.className = 'gbody';
        sec.blocks.forEach(function (b) { var e = guideBlock(b); if (e)
            body.appendChild(e); });
        d.appendChild(sm);
        d.appendChild(body);
        list.appendChild(d);
        items.push({ d: d, text: guideFold(sec.title + ' ' + body.textContent) });
    });
    q.oninput = function () {
        var k = guideFold(q.value).trim(), shown = 0;
        items.forEach(function (x) { var ok = !k || x.text.indexOf(k) >= 0; x.d.style.display = ok ? '' : 'none'; if (k && ok) {
            x.d.open = true;
            shown++;
        } });
        empty.style.display = k && !shown ? '' : 'none';
    };
    var empty = h('div', { class: 'msg info' }, 'Không có mục nào khớp từ khóa.');
    empty.style.display = 'none';
    root.appendChild(list);
    root.appendChild(empty);
    return root;
};
