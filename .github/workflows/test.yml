name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # sync.test dựng lại gói từ 6_NGUON bằng build.py nên cần Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Thoát mã 1 nếu có test hỏng, mã 3 nếu có test BLOCKED (chưa xác minh) — cả hai đều làm job thất bại
      - name: Chạy toàn bộ test (Node, Sheet/Cache giả)
        run: node 4_TESTS/run-all.cjs

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ui.e2e tạo tệp .xlsx mẫu bằng Python + openpyxl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Cài Playwright và Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      # Thoát mã 3 nếu có phép đo BLOCKED (chưa xác minh) — job thất bại
      - name: Kiểm thử giao diện (Chromium, Backend thật + Sheet giả)
        run: node 5_UI_TESTS/ui.e2e.cjs
      - name: Hồi quy tự lưu nháp
        run: node 5_UI_TESTS/autosave.regression.cjs
      - name: Tự kiểm công cụ đo tải xuống
        run: node 5_UI_TESTS/download.selftest.cjs
